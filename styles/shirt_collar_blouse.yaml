# 기본 셔츠 칼라 블라우스 (p.48) = 블라우스 몸판(시추니 원형 상속) + 소매 원형.
# 몸판 암홀 곡선 길이가 소매로, 목선 길이가 칼라밴드로, 칼라밴드 윗선 길이가 칼라로 자동 전달된다.
name: 셔츠 칼라 블라우스
id: shirt_collar_blouse
source: reference/portfolio.pdf p.48

blocks:
  body:
    block: ../blocks/shirt_collar_blouse_body.yaml
  sleeve:
    block: ../blocks/sleeve_basic.yaml
    measurements:
      앞AH: "len(body.앞암홀)"
      뒤AH: "len(body.뒤암홀)"
      소매산단계: 기본        # 소매산높이 = AH/3 − 1/2
      앞소매이세: -3/8        # 도면 표기 '앞AH − 3/8'
      뒤소매이세: -3/8
      소매길이: 22
      팔꿈치길이: 12
  band:
    block: ../blocks/shirt_collar_band.yaml
    measurements:
      뒤네크: "len(body.뒤목선)"
      앞네크: "len(body.앞목선)"
  collar:
    block: ../blocks/shirt_collar.yaml
    measurements:
      밑변: "len(band.윗선)"
  cuff:
    block: ../blocks/cuff.yaml
  placket:
    block: ../blocks/sleeve_placket.yaml
