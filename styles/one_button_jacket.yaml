# 원버튼 테일러드 자켓 (p.83) = 몸판 + 두 장 소매 + 칼라
name: 원버튼 테일러드 자켓
id: one_button_jacket
source: reference/portfolio.pdf p.83

blocks:
  body:
    block: ../blocks/one_button_jacket_body.yaml
  sleeve:
    block: ../blocks/sleeve_two_piece.yaml
    measurements:
      앞AH: "len(body.앞암홀)"
      뒤AH: "len(body.뒤암홀)"
      소매산단계: 중간
      소매길이: 24
      팔꿈치길이: 13
      소매부리들임: 1.5
      상동선내림: 3/8
  collar:
    block: ../blocks/tailored_collar.yaml
    measurements:
      뒤네크: "len(body.뒤목선)"
      고지네크: "len(body.고지라인)"
      칼라줄임: 1/8
