# 헌팅 자켓 (p.91) = 몸판 + 두 장 소매 + 칼라
name: 헌팅 자켓
id: hunting_jacket
source: reference/portfolio.pdf p.91

blocks:
  body:
    block: ../blocks/hunting_jacket_body.yaml
  sleeve:
    block: ../blocks/sleeve_two_piece.yaml
    measurements:
      앞AH: "len(body.앞암홀)"
      뒤AH: "len(body.뒤암홀)"
      소매산단계: 약간낮음
      소매길이: 22
      팔꿈치길이: 12
      소매부리들임: 2.1/2
      상동선내림: 3/8
      앞이동: 0            # 오버사이즈는 두 장 소매 겹침분을 안 주기도 한다 (p.100)
      뒤이동: 2.1/4
  collar:
    block: ../blocks/stand_collar.yaml
    measurements:
      뒤네크: "len(body.뒤목선)"
      앞네크: "len(body.앞목선)"     # 라펠이 없다 — 칼라는 앞목선에 달린다
