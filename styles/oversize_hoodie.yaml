# 오버사이즈 후드 (p.59) = 무다트 몸판 + 낮은 소매산 소매 + 후드 + 밑단·소매부리 시보리
name: 오버사이즈 후드
id: oversize_hoodie
source: reference/portfolio.pdf p.59

blocks:
  body:
    block: ../blocks/oversize_hoodie_body.yaml
  sleeve:
    block: ../blocks/sleeve_basic.yaml
    measurements:
      앞AH: "len(body.앞암홀)"
      뒤AH: "len(body.뒤암홀)"
      소매산단계: 낮음
      소매길이: 21
      팔꿈치길이: 11
      뒤가이드위: 1.3/4     # 오버사이즈 — 소매통이 넓어 하바가 넓어지므로 Ⓐ·Ⓑ 를 줄인다
      앞가이드위: 1.1/2
      소매부리들임: 4.7/8
  hood:
    block: ../blocks/hood.yaml
    measurements:
      네크길이: "len(body.앞목선) + len(body.뒤목선)"
      형식: 한장
      앞목거리: "body.앞목거리"
  밑단시보리:
    block: ../blocks/rib.yaml
    measurements:
      몸판둘레: "body.패턴엉덩이"
      줄임: 4.5/8          # 완성 밑단 39.3/8 — 블루종 핏
      높이: "body.밑단시보리높이"
  소매부리시보리:
    block: ../blocks/rib.yaml
    measurements:
      몸판둘레: 11.1/4
      줄임: 3
      높이: 1.1/4
