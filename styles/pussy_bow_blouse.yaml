# 푸시 보우 블라우스 (p.55) = 몸판 + 소매 + 보우 타이 (타이 목길이는 몸판 목선에서 자동)
name: 푸시 보우 블라우스
id: pussy_bow_blouse
source: reference/portfolio.pdf p.55

blocks:
  body:
    block: ../blocks/pussy_bow_blouse_body.yaml
  sleeve:
    block: ../blocks/sleeve_basic.yaml
    measurements:
      앞AH: "len(body.앞암홀)"
      뒤AH: "len(body.뒤암홀)"
      소매산단계: 약간높음
      소매산조정: 3/4   # p.55 표기
      앞소매이세: 1/4
      뒤소매이세: 1/4
      소매길이: 25
      팔꿈치길이: 13
  tie:
    block: ../blocks/bow_tie.yaml
    measurements:
      뒤구간: "len(body.뒤목선)"   # 뒤중심 → 목옆점 = 뒤네크둘레/2
      앞구간: 2.3/4                 # 목옆점 → 트임(도매) p.55 표기
      전체길이: 27.1/2              # p.55 표기
  cuff:
    block: ../blocks/cuff.yaml
    measurements:
      가로: 8.1/4
