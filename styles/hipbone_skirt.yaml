# 힙본 스커트 = 힙본 원형 + 앞·뒤 곡선 오비.
# 오비 밑선은 몸판 허리선 길이를 그대로 받고, 윗선(= 허리둘레)은 그보다 앞 5/8 · 뒤 3/4 짧다.
name: 힙본 스커트
id: hipbone_skirt
source: reference/portfolio.pdf p.7

blocks:
  skirt:
    block: ../blocks/skirt_hipbone.yaml
  waistband_front:
    block: ../blocks/waistband_curved.yaml
    measurements:
      밑선: "len(skirt.앞허리선)"
      차이: 5/8
      높이: 1.1/2
  waistband_back:
    block: ../blocks/waistband_curved.yaml
    measurements:
      밑선: "len(skirt.뒤허리선1) + len(skirt.뒤허리선2)"
      차이: 3/4
      높이: 1.1/2
      연장: 1.1/4
