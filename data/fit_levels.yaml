# 핏 단계 → 여유 가감 (인치). 마법사가 아이템의 포트폴리오 여유(레귤러)에 더한다.
#
# ※ 초안이다. 포트폴리오의 신체/패턴 사이즈 차이가 곧 아이템별 여유이고, 그 값이 "레귤러"다.
#    타이트·루즈·오버는 거기서 얼마나 빼고 더할지를 정한 것인데, 아이템·소재마다 달라서
#    현장 값으로 고쳐 주셔야 한다. 이름은 원형 파일의 치수 이름과 같아야 한다.
#    없는 치수는 건너뛴다 (예: 스커트에는 여유(가슴)가 없다).
levels:
  타이트:  {여유: -1,     허리여유: -1/2, 엉덩이여유: -1/2, 품여유: -1/2}
  레귤러:  {여유: 0,      허리여유: 0,    엉덩이여유: 0,    품여유: 0}
  루즈:    {여유: 1.1/2,  허리여유: 1/2,  엉덩이여유: 1,    품여유: 1/2}
  오버:    {여유: 3,      허리여유: 1,    엉덩이여유: 2,    품여유: 1}
