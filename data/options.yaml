# 디테일 옵션 — 스타일의 부속을 갈아끼운다 (마법사 4단계 · 화면 왼쪽 "디테일").
#
# slot 마다 choices 가 있고, 각 choice 는 넣을 원형(blocks)과 치수 연결(measurements)을 적는다.
# 연결식의 {base} 는 몸판 원형의 키(body / skirt / pants)로 바뀐다. len(x.앞허리선*) 은 그 이름으로 시작하는
# 완성선 길이의 합이라 허리선이 안·밖으로 나뉜 원형에서도 그대로 쓴다.
# requires 는 몸판에 있어야 하는 치수 이름(또는 line:선이름) — 없으면 그 선택지는 회색이 된다.
# 슬롯을 바꾸면 그 슬롯의 어느 선택지에든 속하는 기존 원형은 빠지고, 새 원형이 들어간다.
# 빠진 원형에 있던 치수(소매길이 …)는 새 원형에 같은 이름이 있으면 이어받는다.
slots:
  - id: collar
    label: 칼라
    applies: [top, jacket]
    choices:
      - {id: none, label: 없음}
      - id: shirt
        label: 셔츠 칼라 (밴드 + 칼라)
        blocks:
          band:   {block: shirt_collar_band, measurements: {뒤네크: "len({base}.뒤목선)", 앞네크: "len({base}.앞목선)"}}
          collar: {block: shirt_collar, measurements: {밑변: "len(band.윗선)"}}
      - id: band
        label: 차이나 칼라 (밴드만)
        blocks:
          collar: {block: shirt_collar_band, measurements: {뒤네크: "len({base}.뒤목선)", 앞네크: "len({base}.앞목선)", 앞올림: 1, 앞연장: 1/2}}
      - id: stand
        label: 스탠드 칼라
        blocks:
          collar: {block: stand_collar, measurements: {뒤네크: "len({base}.뒤목선)", 앞네크: "len({base}.앞목선)"}}
      - id: flat
        label: 플랫 칼라
        blocks:
          collar: {block: flat_collar, measurements: {뒤네크: "len({base}.뒤목선)", 앞네크: "len({base}.앞목선)", 어깨길이: "len({base}.뒤어깨선*)"}}
      - id: shawl
        label: 숄 칼라
        requires: [숄고지]
        blocks:
          collar: {block: shawl_collar, measurements: {뒤네크: "len({base}.뒤목선)", 고지네크: "{base}.숄고지"}}
      - id: tailored
        label: 테일러드 칼라
        requires: ["line:고지라인"]
        blocks:
          collar: {block: tailored_collar, measurements: {뒤네크: "len({base}.뒤목선)", 고지네크: "len({base}.고지라인)", 칼라줄임: 1/8}}
      - id: neck_rib
        label: 넥 립 (시보리)
        blocks:
          넥립: {block: rib, measurements: {몸판둘레: "len({base}.앞목선) * 2 + len({base}.뒤목선) * 2", 줄임: 5/8, 높이: 1}}
  - id: sleeve
    label: 소매
    applies: [top, jacket]
    choices:
      - {id: none, label: 민소매}
      - id: basic
        label: 한 장 소매
        blocks:
          sleeve: {block: sleeve_basic, measurements: {앞AH: "len({base}.앞암홀)", 뒤AH: "len({base}.뒤암홀)"}}
      - id: tuck
        label: 턱(셔링) 소매
        blocks:
          sleeve: {block: sleeve_tuck, measurements: {앞AH: "len({base}.앞암홀)", 뒤AH: "len({base}.뒤암홀)"}}
      - id: two_piece
        label: 두 장 소매
        blocks:
          sleeve: {block: sleeve_two_piece, measurements: {앞AH: "len({base}.앞암홀)", 뒤AH: "len({base}.뒤암홀)"}}
  - id: cuff
    label: 소매 밑단
    applies: [top, jacket]
    needs_slot: sleeve
    choices:
      - {id: none, label: 일자 (없음)}
      - id: cuff
        label: 커프스 + 견보루
        blocks:
          cuff:    {block: cuff, measurements: {}}
          placket: {block: sleeve_placket, measurements: {}}
      - id: rib
        label: 시보리
        blocks:
          소매부리시보리: {block: rib, measurements: {몸판둘레: "len(sleeve.소매부리)", 줄임: 3, 높이: 1.1/4}}
  - id: hem
    label: 밑단
    applies: [top]
    choices:
      - {id: none, label: 일자 (없음)}
      - id: rib
        label: 시보리
        requires: [패턴엉덩이]
        blocks:
          밑단시보리: {block: rib, measurements: {몸판둘레: "{base}.패턴엉덩이", 줄임: 4, 높이: 2}}
  - id: waistband
    label: 오비
    applies: [skirt, pants]
    choices:
      - {id: none, label: 없음}
      - id: straight
        label: 일자 오비
        blocks:
          waistband: {block: waistband, measurements: {허리4: "(len({base}.앞허리선*) + len({base}.뒤허리선*)) / 2"}}
      - id: curved
        label: 곡선 오비 (앞·뒤)
        blocks:
          waistband_front: {block: waistband_curved, measurements: {밑선: "len({base}.앞허리선*)", 차이: 5/8, 높이: 1.1/2}}
          waistband_back:  {block: waistband_curved, measurements: {밑선: "len({base}.뒤허리선*)", 차이: 3/4, 높이: 1.1/2, 연장: 1.1/4}}
      - id: elastic
        label: 고무줄 밴드
        requires: [패턴허리, 밴드완성, 밴드폭]
        blocks:
          band: {block: elastic_band, measurements: {패턴허리: "{base}.패턴허리", 완성: "{base}.밴드완성", 높이: "{base}.밴드폭"}}
