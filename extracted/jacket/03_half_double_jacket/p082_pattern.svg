<g id="pattern_text" fill="rgb(40,30,25)">
<text x="32.33" y="29.15" font-size="11">여성 평균 겨드랑이 둘레의 중요성</text>
<text x="149.62" y="92.98" font-size="8.1">WL</text>
<text x="324.23" y="92.42" font-size="8.1">WL</text>
<text x="28.25" y="179.83" font-size="9">뒤길이가 짧아서 뒤가 달려 올라갈 때에는 허리에서 절개하여 등길이를 늘려주는 방법도 있다. 등길이를 늘려주는 방법으로는 2가지가 있는데</text>
<text x="28.25" y="194.83" font-size="9">만약 사이바의 곡이 세지 않다면 두 개 동시에 벌려주는 것이 좋다. 뒤를 벌렸을 떄 뒤중심 곡이 일자를 넘어가면 일자 형태로 다시 블렌딩 해준다.</text>
<text x="297" y="159.45" font-size="8"> ② 사이바와 뒤중심판을 같이 벌리는 방법이 있다.</text>
<text x="161.19" y="158.82" font-size="8">① 뒤중심 판만 벌리는 방법</text>
<text x="24.98" y="27.66" font-size="13">뒤길을 허리에서 늘려주는 두 가지 방법</text>
