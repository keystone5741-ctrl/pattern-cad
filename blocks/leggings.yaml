# 레깅스 — p.41–42. 고무줄 허리, 다트 없음. 트레이닝 팬츠와 같은 구조지만 몸에 밀착된다.
#
# 유의사항 (p.41):
#   - 레깅스에 밴드를 달아도 **트레이닝 팬츠와 달리 셔링이 생기지 않는 이유**는
#     엉덩이둘레가 허리둘레만큼 크게 줄어 **허리와 엉덩이의 분량 차이가 적어졌기** 때문이다
#   - **E-밴드 길이**: 밴드는 허리 완성 사이즈보다 **2~3 작게** 제도한다.
#     **밴드 폭이 작을수록 차이를 크게** 준다 — 폭이 작으면 탄성이 약해 같은 길이라도 피트감이 다르다
#   - **뒤중심이 당겨져 갈매기지는 것은 밑위길이가 짧기 때문**이다. 앉거나 활동하면 엉덩이 때문에
#     뒤밑위가 당겨져 더 심해진다. **밑위길이를 내리거나** 뒤중심을 눕혀 해결한다
#
# 도면 표기의 H/4 는 **신체** 엉덩이둘레(35.1/2) 기준이다: 앞폭 = H/4 − 1.1/4, 뒤폭 = H/4 − 1.
