# 머메이드 원피스 — p.67–68. 무릎 위까지 몸에 붙고 무릎 아래에서 퍼진다. 플랫 칼라.
#
# 유의사항 (p.68):
#   - **플랫 칼라의 폭 = 스탠드 분량 + 겉으로 보이는 칼라 폭** (blocks/flat_collar.yaml 참고)
#   - **견갑골 입체분량**: 칼라에 견갑골이 가려지는 디자인이라면 **어깨에 견갑골 다트**를 넣어
#     분량을 확보하는 편이 남는 분량 없이 입체적인 옷이 된다 (여기서는 다트를 살린다)
#   - **칼라 길이는 몸판보다 1/16~1/4 짧게** M.P 해 늘려 봉제한다 — 목옆점이 꺾이는 것을 막는다.
#     뒤네크는 곡이 적어 M.P 하지 않는다
#   - **겉칼라(우아에리) 식서 / 안칼라(지에리) 바이어스**
#   - **무릎을 덮는 기장에서 무릎둘레**: 트임이 없고 무릎을 덮는 옷은 걷는 보폭(최소 85cm)을
#     고려해 **완성 무릎둘레가 80~90cm(31.1/2~35.1/2)** 되게 제도한다.
#     또 **무릎 포인트를 2" 가량 올려** 무릎 밑을 길어 보이게 하면 실루엣이 좋아진다
extends: top_body.yaml
name: 머메이드 원피스 몸판
id: mermaid_dress_body
source: reference/portfolio.pdf p.67

measurements:
  여유:         {value: 2, note: 패턴 가슴 35.1/2}
  진동깊이:     {value: 8.3/4}
  등길이:       {value: 15}
  엉덩이길이:   {value: 7.1/2}
  기장:         {value: 45.1/4}
  뒤어깨끝너비: {value: 7.1/16, note: 어깨너비 14.1/8}
  뒤어깨다트폭: {value: 1/4, note: 칼라에 가려지므로 견갑골 다트를 살린다}
  옆선허리들임: {value: 1/2, note: 패턴 허리 29.1/2 ≒ 표기 29.5/8}
  엉덩이여유:   {value: 1/2, note: 패턴 엉덩이 37.1/2 ≒ 표기 37.3/8}
  무릎길이:     {value: 21, note: 허리선에서 무릎까지 (p.67 눈금 표기)}
  무릎올림:     {value: 2, note: 무릎 포인트를 올려 무릎 밑을 길어 보이게}
  무릎둘레:     {value: 33, note: 완성 31.1/2~35.1/2 (80~90cm) — 보폭 85cm 를 고려}
  무릎반:       {formula: "무릎둘레 / 4"}
  밑단벌림:     {value: 3.1/2, note: 무릎 아래에서 퍼지는 머메이드}

points:
  KL_SS_F: {ko: 앞 옆선 무릎점, at: [무릎반, "등길이 + 무릎길이 - 무릎올림"]}
  KL_SS_B: {ko: 뒤 옆선 무릎점, at: ["전폭 - 무릎반", "등길이 + 무릎길이 - 무릎올림"]}

lines:
  replace:
    - {name: 앞옆선, piece: 앞판, role: outline, curve: [BD2, WL_SS_F, HL_SS_F, KL_SS_F, HEM_SS_F],
       tangents: {BD2: {along: [BD2, WL_SS_F]}, WL_SS_F: [0, 1], HL_SS_F: [0, 1], KL_SS_F: [0, 1]},
       handles: [[0.33, 0.33], [0.33, 0.33], [0.33, 0.33], [0.4, 0.4]]}
    - {name: 뒤옆선, piece: 뒤판, role: outline, curve: [UP2, WL_SS_B, HL_SS_B, KL_SS_B, HEM_SS_B],
       tangents: {UP2: {along: [UP2, WL_SS_B]}, WL_SS_B: [0, 1], HL_SS_B: [0, 1], KL_SS_B: [0, 1]},
       handles: [[0.33, 0.33], [0.33, 0.33], [0.33, 0.33], [0.4, 0.4]]}
  add:
    - {name: 무릎선, role: construction, pts: [KL_SS_F, KL_SS_B]}

handles:   # 곡선 모양을 원본 도면에 맞춘 값 — tools/fit_all.py
  앞밑단: [[0.224, 0.355]]
