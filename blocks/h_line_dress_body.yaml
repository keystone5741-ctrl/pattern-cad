# H라인 원피스 — p.65–66. 허리가 맞는 듯한 피트 실루엣.
#
# 유의사항 (p.66):
#   - **피트되는 디자인의 최소 허리둘레는 28**. 이보다 작으면 여성 신체 허리(26)에 비해
#     여유가 부족해 착용할 수 없다
#   - **가슴둘레가 원형보다 커지면 앞판의 M.P 분량도 넓어진다.** M.P 분량이 길어진 만큼
#     **앞길이를 길게** 제도해야 한다
#   - **옆선 볼록**: 영캐주얼·캐릭터는 ① 1/8 정도만 약간 볼록하게,
#     커리어·부인복처럼 여유분이 필요하면 ② 1/8~1/4 볼록하게 제도한다
#   - **허리 포인트를 올릴 때는 몸판보다 옆솔기 쪽을 더 올린다** (5/8~3/4, 몸판 1/2).
#     옆선이 기본적으로 바이어스라 암홀이 흐르는 분량 때문에 옆선이 내려가기 때문이다
#   - **두 장 소매**: 앞소매를 제도할 때 **1/4~1/2 내린 지점에 상동선(소매통선)을 맞춰** 제도한다
