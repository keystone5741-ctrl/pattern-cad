# 힙본 팬츠 — p.30. 제허리 팬츠 원형에서 허리선을 내린다.
#
# 유의사항:
#   - **힙본 팬츠는 힙본 스커트보다 허리선을 더 내린다** (팬츠 3", 스커트 2")
#   - 뒤판 허리선은 앞판으로 뒤중심 각도선을 찾아 **연장된 앞판 허리선과 직각**이 되게 제도하고,
#     **뒤중심에서 1/4 올려** 허리선을 그린다. 올리지 않으면 뒤중심이 처지지 않고 일자로 서서
#     미적으로는 좋지만 밑위길이가 짧아져 앉거나 활동할 때 허리가 내려가거나 엉덩이에 끼는 현상이 생긴다.
#     그래도 뒤중심 길이가 짧으면 **뒤중심선을 더 눕혀** 길이를 늘린다
#   - 벨트고리: 폭 1/4~3/8 이 보편적, 길이는 오비보다 3/8 가량 더 내려간 길이
extends: pants_basic.yaml
name: 힙본 팬츠
id: pants_hipbone
source: reference/portfolio.pdf p.30

measurements:
  힙본내림:   {value: 3, note: 허리선을 내리는 양 (스커트 2" 보다 크다)}
  허리기준:   {formula: "힙본내림"}
  허리여유:   {value: 3.5/8, note: 허리선이 3" 내려가 패턴 허리 29.5/8}
  앞뒤차:     {value: 1/2, note: p.30 표기 H/4 ∓ 1/2. 앞다트가 없어 앞 엉덩이를 작게}
  앞무릎폭:   {value: 8, note: p.30 실측}
  뒤무릎폭:   {value: 9, note: p.30 실측}
  밑위길이:   {value: 9.7/8}
  기장:       {value: 39.3/8, note: 신체 허리선 기준 (p.30 눈금). 내려간 허리에서는 36.3/8}
  밑단둘레:   {value: 7.1/2}
  뒤중심올림: {value: 1/4, note: 힙본에서는 반드시 올려 뒤밑위 길이를 늘린다}
  벨트고리폭: {value: 3/8, note: 1/4~3/8}
  벨트고리길이: {value: 1.7/8, note: 오비보다 3/8 더 내려간 길이}
  뒤다트폭:   {value: 1.1/4, note: 허리선이 내려가 허리~엉덩이 차가 줄어 다트도 작아진다}
  앞다트폭:   {value: 0, note: 힙본은 허리선이 내려가 앞다트가 거의 없다}
  앞다트길이: {value: 0}

points:
  F_W_CF:  {ko: 앞중심 허리점, at: ["앞중심들임", 힙본내림]}
  F_W_SS:  {ko: 앞 옆선 허리점, at: ["앞폭 - 옆선들임", "힙본내림 - 옆선올림"]}
  B_W_CB0: {ko: 뒤중심 허리 기준(세운 상태), at: ["B_OX.x", "힙본내림 - 뒤중심올림"]}
  F_D_C:   {ko: 앞다트 중심, at: ["(앞중심들임 + 앞폭 - 옆선들임)/2", 힙본내림],
            note: 내려간 허리선 위로 옮긴다}
  BL1: {ko: 벨트고리 위, at: ["앞폭 * 0.55", 힙본내림]}
  BL2: {from: BL1, dy: 벨트고리길이}

lines:
  add:
    - {name: 벨트고리, piece: 앞판, role: mark, pts: [BL1, BL2], note: 폭 1/4~3/8}
