# 점프수트 하의 — p.71–72. 허리에서 상의와 이어진다.
#
# 유의사항 (p.72):
#   - **샅의 길이는 앞판과 뒤판을 합해 5" 이상 가지 않는다** (여기서는 1.1/8 + 3.3/4 = 4.7/8)
#   - 뒤중심 각도를 눕히면 옆솔기가 기울어져 A자로 보인다. 작업복은 활동성 우선이라
#     목적에 따라 각도를 바꾼다
extends: pants_basic.yaml
name: 점프수트 하의
id: jump_suite_pants
source: reference/portfolio.pdf p.71

# 도면 검증용 — p.71 은 눈금 이름표가 조각마다 흩어져 있어 못 믿는다.
# 도면에 적힌 밑단 폭(앞 4.3/4 x2, 뒤 5.1/2 x2)으로 잰 배율을 쓴다.
# 도면은 뒤판을 뒤중심이 오른쪽으로 오게 놓았다 (앞판은 앞중심이 왼쪽) — 견줄 때 뒤집는다
verify: {scale: 7.22, cluster: 0, mirror: [뒤판]}

measurements:
  허리여유:   {value: 15.3/4, note: 패턴 허리 41.3/4 — 상의 허리와 같다}
  엉덩이여유: {value: 9.1/8, note: 패턴 엉덩이 44.5/8}
  앞뒤차:     {value: 1/4}
  밑위길이:   {value: 14.1/8, note: p.71 눈금 표기. 작업복이라 활동성을 위해 아주 깊다}
  무릎길이:   {value: 21}
  기장:       {value: 41.3/8, note: p.71 눈금 표기 (허리에서 밑단)}
  앞샅:       {value: 1.1/8}
  뒤샅:       {value: 3.3/4, note: 앞 + 뒤 = 4.7/8 ≤ 5}
  뒤중심각:   {value: 7.3/4, note: p.71 실측 7.71도. 작업복이라 정장보다 세운다}
  앞다트폭:   {value: 0, note: 오버사이즈 작업복 — 다트 없음}
  뒤다트폭:   {value: 0}
  옆선들임:   {value: 1/2, note: 다트 없이 옆선에서만 허리를 줄인다}
  앞중심들임: {value: 0}
  앞무릎폭:   {value: 11}
  뒤무릎폭:   {value: 12}
  밑단둘레:   {value: 10.1/4, note: p.71 표기 — 앞 4.3/4 x2 = 9.1/2, 뒤 5.1/2 x2 = 11}
  앞뒤밑단차: {value: 3/4}

lines:
  # 다트 분량이 0 이라 다트를 그리면 몸판 한가운데 헛선이 생긴다
  remove: [앞다트, 뒤다트]
