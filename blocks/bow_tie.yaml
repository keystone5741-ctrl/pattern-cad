# 보우 타이 (푸시 보우) — p.55–56.
#
# 유의사항 (p.56):
#   - 보우 타이를 **일자로 제도하면 몸판 셔링에 비해 타이가 작고 연약해 보인다.**
#     **트임(도매 지점)부터 서서히 커지는 형태**가 푸시 보우 블라우스에 적절하다
#   - 보우 타이는 **앞목점에서 수평으로 간 지점**에서 도매된다(달리기 시작한다)
#
# 도면(p.55) 실측:
#   전체 27.1/2", 뒤중심 쪽 폭 2", 타이 끝 폭 4",
#   뒤중심→목옆점 = 뒤네크둘레/2, 목옆점→트임 = 2.3/4",
#   윗선은 일자, 아랫선만 벌어진다. 끝은 2" 구간이 직선으로 남는다.
#
# 좌표계: 뒤중심(골선)이 원점, +x 가 타이가 뻗어나가는 쪽, y 아래.
#   이 조각을 좌우 두 장 재단해 뒤중심에서 이어 붙이면 한 줄 타이가 된다.
name: 보우 타이
id: bow_tie
category: part
units: inch
source: reference/portfolio.pdf p.55

measurements:
  뒤구간:   {value: 3.1/4, note: 뒤중심 → 목옆점 = 뒤네크둘레/2 — 스타일에서 몸판 뒤목선으로 받는다}
  앞구간:   {value: 2.3/4, note: 목옆점 → 트임(도매 지점) — p.55 표기. 앞목선 전부가 아니라 여기까지만 목선에 달린다}
  목길이:   {formula: "뒤구간 + 앞구간", note: 목선에 달리는 구간}
  전체길이: {value: 27.1/2, note: 뒤중심에서 타이 끝까지 — p.55 표기}
  타이길이: {formula: "전체길이 - 목길이", note: 트임부터 늘어뜨려지는 부분}
  시작폭:   {value: 2, note: 뒤중심 쪽 폭 — p.55 표기}
  끝폭:     {value: 4, note: 타이 끝 폭 — p.55 표기. 일자로 하면 연약해 보여 끝으로 갈수록 넓힌다}
  끝직선:   {value: 2, note: 타이 끝에서 아랫선이 곧게 남는 구간 — p.55 표기}
  끝올림:   {value: 3/8, note: 끝직선이 시작되는 지점을 끝폭보다 이만큼 올린다}

points:
  CB_T: {ko: 뒤중심 위, at: [0, 0]}
  CB_B: {ko: 뒤중심 아래, at: [0, 시작폭]}
  SNP:  {ko: 목옆점 너치, at: [뒤구간, 시작폭]}
  OP:   {ko: 트임(도매) 너치, at: [목길이, 시작폭]}
  SNP_A: {at: [뒤구간, "시작폭 - 1/4"]}
  SNP_B: {at: [뒤구간, "시작폭 + 1/4"]}
  OP_A:  {at: [목길이, "시작폭 - 1/4"]}
  OP_B:  {at: [목길이, "시작폭 + 1/4"]}
  K:    {ko: 아랫선 꺾임, at: ["전체길이 - 끝직선", "끝폭 - 끝올림"]}
  E_T:  {ko: 타이 끝 위, at: [전체길이, 0]}
  E_B:  {ko: 타이 끝 아래, at: [전체길이, 끝폭]}

lines:
  - {name: 뒤중심, role: outline, pts: [CB_T, CB_B]}
  - {name: 윗선, role: outline, pts: [CB_T, E_T], note: 윗선은 일자다}
  - {name: 아랫선, role: outline, curve: [CB_B, OP, K],
     tangents: {CB_B: [1, 0]}, handles: [[0.5, 0.4], [0.45, 0.5]]}
  - {name: 끝아랫선, role: outline, pts: [K, E_B]}
  - {name: 타이끝, role: outline, pts: [E_T, E_B]}
  - {name: 끝사선, role: mark, pts: [CB_T, K],
     note: 끝을 어슷하게 마무리할 때의 절개선 — 도면에 함께 그려져 있다}
  - {name: 목옆점표시, role: mark, pts: [SNP_A, SNP_B], note: 여기까지가 뒤네크}
  - {name: 트임표시, role: mark, pts: [OP_A, OP_B], note: 여기서 도매가 끝나고 매듭이 된다}

verify:
  mirror: true
