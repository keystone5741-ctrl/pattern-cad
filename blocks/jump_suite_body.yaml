# 점프수트 상의 — p.71–72. 오버사이즈 작업복 실루엣, 허리에서 하의와 이어진다.
#
# 유의사항 (p.72):
#   - **오버사이즈 상의는 앞·뒤 둘레가 같으면 옆선이 뒤로 넘어가 보인다.**
#     상의는 뒤판보다 **앞판 가슴둘레를 3cm(≈1.1/4) 가량 작게** 제도한다
#     → 여기서는 옆선여유를 음수(−5/8)로 주어 앞반폭을 줄이고 뒤반폭을 늘린다
#   - **점프수트 샅의 길이는 앞판과 뒤판을 합해 5" 이상 가지 않는 것**을 기본으로 한다
#   - 뒤중심 각도를 눕히면 옆솔기가 기울어져 팬츠가 A자로 보일 수 있다.
#     **작업복은 실루엣보다 활동성**에 초점을 맞추므로 목적에 따라 변형한다
extends: box_body.yaml
name: 점프수트 상의
id: jump_suite_body
source: reference/portfolio.pdf p.71

# 도면 검증용 — p.71 은 눈금 이름표가 조각마다 흩어져 있어 못 믿는다.
# 도면에 적힌 밑단 폭(앞 4.3/4 x2, 뒤 5.1/2 x2)으로 잰 배율을 쓴다.
verify: {scale: 7.22, cluster: 0}

measurements:
  여유:         {value: 10.3/4, note: 패턴 가슴 44.1/4}
  옆선여유:     {value: -5/8, note: 앞판을 뒤판보다 1.1/4(≈3cm) 작게 — 옆선이 뒤로 넘어가 보이지 않게}
  진동깊이:     {value: 10.1/4}
  등길이:       {value: 15}
  기장:         {value: 15, note: 허리선에서 하의와 이어진다. 총장 56.5/8 은 하의를 포함한 길이}
  뒤어깨끝너비: {value: 8.7/8, note: 어깨너비 17.3/4}
  앞품:         {value: 17}
  어깨끝품들임: {value: 1/2, note: 뒤품너비는 어깨끝점에서 이만큼 들어간 곳 (p.56 규칙)}
  뒤품:         {formula: "(뒤어깨끝너비 - 어깨끝품들임) * 2",
                note: 18.1/2 로 두면 뒤품선이 어깨끝점 밖으로 나간다 — 도면 겹침도 0.287 → 0.256}
  옆선허리들임: {value: 5/8, note: 패턴 허리 41.3/4 — 하의 허리와 같다}
  앞옆밑단올림: {value: 0}
  뒤옆밑단올림: {value: 0}

# 기장 = 등길이 이므로 허리·엉덩이·밑단 옆점이 한 높이에 겹친다.
# 상자형 옆선(겨드랑점→허리→엉덩이→밑단)을 그대로 쓰면 같은 높이의 세 점 사이를 오가며 선이 되돌아간다
# → 옆선은 겨드랑점→허리옆점 한 구간, 밑단은 허리옆점까지. 도면 밑단 폭(앞 4.3/4 x2 · 뒤 5.1/2 x2)과 맞는다
lines:
  replace:
    - {name: 앞옆선, piece: 앞판, role: outline, curve: [UP2, WL_SS_F],
       tangents: {UP2: {along: [UP2, WL_SS_F]}, WL_SS_F: [0, 1]}, handles: [[0.33, 0.33]]}
    - {name: 뒤옆선, piece: 뒤판, role: outline, curve: [UP2, WL_SS_B],
       tangents: {UP2: {along: [UP2, WL_SS_B]}, WL_SS_B: [0, 1]}, handles: [[0.33, 0.33]]}
    - {name: 앞밑단, piece: 앞판, role: outline, pts: [HEM_CF, WL_SS_F]}
    - {name: 뒤밑단, piece: 뒤판, role: outline, pts: [CB_HEM, WL_SS_B]}
