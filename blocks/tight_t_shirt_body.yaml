# 타이트 티셔츠 몸판 — p.61–62. 다이마루(니트). 신체보다 작게 제도한다.
#
# 유의사항 (p.62):
#   - **타이트 티셔츠는 뒤허리에 남는 분량이 무조건 생긴다.** 그래서
#     **뒤판 옆선 길이를 앞판보다 5/8~1 줄여** 뒤판을 늘려 봉제한다
#   - **일체형(앞뒤 한 장) 앞판 제도**: **뒤옆목점에서 5/8 직각으로 내려가 앞옆목점**을 잡는다
#     (뒤네크너비를 앞네크너비보다 작게 해 넥라인이 남지 않게).
#     **뒤어깨끝점에서 1" 내려가 앞어깨 각도**를 잡으면 뒤판으로 앞네크너비와 앞어깨각도를 찾을 수 있다
