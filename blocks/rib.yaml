# 시보리 · 립(RIB) — p.58 스웻 셔츠. 몸판 둘레보다 **작게** 제도해 늘려 봉제한다.
#
# 유의사항 (p.58):
#   - **밑단 시보리**: 몸판 밑단둘레보다 **5~20cm** 작게 제도하는 것이 일반적이고,
#     **블루종 핏**이 되려면 **10cm 이상** 작아야 한다
#   - **넥 립**: 폭 5/8~3/4 이 기본 (여성 립 사이즈 1/2~3/4).
#     **윗 네크라인을 기준으로 립 밑을 늘려 봉제**하므로 탄성회복력이 좋은 시보리 원단을 쓴다.
#     몸판과 같은 원단을 쓰면 탄성이 없어 윗 네크둘레가 들뜬다
#   - **앞네크가 뒤네크보다 길므로 줄이는 비율을 다르게** 한다.
#     예: 앞네크 4.1/2 → 3/16 줄임, 뒤네크 3.3/8 → 1/8 줄임
#   - 립의 **절개선은 입어서 왼쪽**으로 보내고, **옆목점에서 뒤로 1"** 옮겨
#     어깨에 시접이 몰려 두꺼워지지 않게 한다
name: 시보리 · 립
id: rib
category: part
units: inch

measurements:
  몸판둘레: {value: 40, note: 립이 달리는 몸판 쪽 둘레 — 스타일에서 자동}
  줄임:     {value: 4, note: 밑단 시보리 2~8 (5~20cm), 블루종은 4 이상 (10cm)}
  높이:     {value: 2, note: 완성 폭. 넥 립은 5/8~3/4}
  접음:     {choice: 반접음, options: [반접음, 홑], note: 반접음이면 제도 높이는 두 배}
  길이:     {formula: "몸판둘레 - 줄임"}
  반길이:   {formula: "길이 / 2", note: 앞·뒤 반쪽}
  제도높이: {formula: "높이 * 2", note: 반으로 접어 다는 경우}

points:
  TL: {at: [0, 0]}
  TR: {at: [반길이, 0]}
  BR: {at: [반길이, 제도높이]}
  BL: {at: [0, 제도높이]}
  FL: {ko: 접는선 왼쪽, at: [0, 높이]}
  FR: {ko: 접는선 오른쪽, at: [반길이, 높이]}

lines:
  - {name: 외곽, role: outline, pts: [TL, TR, BR, BL], closed: true}
  - {name: 접는선, role: fold, pts: [FL, FR]}
