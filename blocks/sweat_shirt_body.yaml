  등길이:       {value: 15}
  엉덩이길이:   {value: 7.1/2}
  기장:         {value: 25.5/8, note: 밑단 시보리 포함 길이}
  뒤어깨끝너비: {value: 9, note: 어깨너비 18 — 어깨가 팔 쪽으로 내려온다}
  어깨각도올림: {value: 1/8, note: 옆목점은 두고 어깨끝점만 올린다. 과하면 암홀에 분량이 남는다}
  뒤어깨끝내림: {formula: "뒤어깨끝내림기준 - 어깨각도올림"}
  뒤어깨끝내림기준: {value: 3/8}
  앞품:         {value: 17}
  뒤품:         {value: 18}
  옆선허리들임: {value: 1/2, note: 패턴 허리 42}
  엉덩이여유:   {value: -1, note: 패턴 엉덩이 40 — 밑단 쪽으로 좁아진다}
  뒤중심가슴들임: {value: 0, note: 다이마루는 뒤중심을 들이지 않는다}
  뒤중심허리들임: {value: 0}
  밑단시보리높이: {value: 2}
  넥립높이:     {value: 3/4, note: 5/8~3/4 (여성 1/2~3/4)}
  앞네크립줄임: {value: 3/16, note: 앞네크가 길어 더 많이 줄인다}
  뒤네크립줄임: {value: 1/8}
  립절개이동:   {value: 1, note: 옆목점에서 뒤로 — 어깨에 시접이 몰리지 않게}
