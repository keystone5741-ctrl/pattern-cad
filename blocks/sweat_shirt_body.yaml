# 스웻 셔츠(맨투맨) 몸판 — p.57–58. 다이마루(니트) 원단.
#
# 유의사항 (p.58):
#   - **옆목점 어깨가 뜰 때**는 어깨 각도를 올린다. **옆목점은 그대로 두고 어깨 끝점만 올린다.**
#     어깨 각도를 올리면 활동은 편해지지만 **올라갈수록 암홀에 남는 분량이 늘어 비리**가 생기므로 과하게 올리지 않는다
#   - **다이마루는 뒤중심을 들이지 않는다.** 원단이 흘러 뒤중심이 딸려 올라가는 현상이 거의 없기 때문이다
#     (티셔츠·맨투맨 등)
#   - **밑단 시보리**: 몸판 밑단둘레보다 5~20cm 작게. **블루종 핏은 10cm 이상** 작아야 한다
#   - **넥 립**: 폭 5/8~3/4. 앞네크가 뒤네크보다 기니 줄이는 비율을 다르게 (앞 3/16, 뒤 1/8).
#     립 절개선은 입어서 왼쪽, 옆목점에서 뒤로 1"
extends: box_body.yaml
name: 스웻 셔츠 몸판
id: sweat_shirt_body
source: reference/portfolio.pdf p.57

