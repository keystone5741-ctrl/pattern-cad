# 두 장 소매 (큰소매 + 작은소매) — p.65 H라인 원피스, 자켓 공통.
#
# 한 장 소매를 앞·뒤 밑선에서 각각 안쪽으로 들여 자른다. 안쪽 가운데가 큰소매,
# 밖으로 남은 두 띠가 작은소매다 (재단할 때 원래 밑선에서 이어 붙인다).
#   큰소매 폭 = 소매통 − 앞이동 − 뒤이동,  작은소매 폭 = 앞이동 + 뒤이동
# 도면(p.65)처럼 **한 장 소매 틀 안에 절개선을 그어** 두 조각을 겹쳐 놓는다.
#
# 유의사항 (p.66):
#   - 두 장 소매는 **앞소매 제도 시 1/4~1/2 내린 지점에 상동선(소매통선)을 맞춰** 제도한다
extends: sleeve_basic.yaml
name: 두 장 소매
id: sleeve_two_piece
source: reference/portfolio.pdf p.65

measurements:
  # 기본값을 p.65 H라인 원피스 소매에 맞춘다 (도면 표기: 소매산높이 = AH/3 − 1/8 = 5.1/4, 소매통 12.1/2)
  앞AH:       {value: 7.7/8}
  뒤AH:       {value: 8.1/4}
  소매산단계: {choice: 중간}
  소매산조정: {value: -1/8}
  앞소매이세: {value: -1/8}
  뒤소매이세: {value: -1/8}
  소매길이:   {value: 24}
  팔꿈치길이: {value: 12.1/2}
  소매부리들임: {value: 1.1/2}
  앞이동:     {value: 1.1/8, note: 소매통선에서 앞 밑선을 안쪽으로 들이는 양}
  뒤이동:     {value: 1.1/4, note: 소매통선에서 뒤 밑선을 안쪽으로}
  앞이동밑단: {value: 1.1/8, note: 밑단에서 들이는 양. 크게 하면 작은소매가 아래로 갈수록 넓어진다}
  뒤이동밑단: {value: 1.1/4}
  상동선내림: {value: 3/8,   note: 1/4~1/2. 앞소매 절개점의 소매통선을 이만큼 내린다}
  언더깊이:   {value: 1,     note: 작은소매 위선이 소매통선보다 아래로 파이는 깊이}
  작은소매폭: {formula: "앞이동 + 뒤이동"}

points:
  # --- 큰소매 절개선
  BS_T: {ko: 큰소매 뒤 절개점(소매통), from: BIC_B, dx: 뒤이동}
  FS_T: {ko: 큰소매 앞 절개점(소매통), at: ["BIC_F.x - 앞이동", "소매산높이 + 상동선내림"]}
  BS_H: {ko: 큰소매 뒤 밑단, from: HEM_B, dx: 뒤이동밑단}
  FS_H: {ko: 큰소매 앞 밑단, from: HEM_F, dx: "-앞이동밑단"}
  BS_E: {ko: 큰소매 뒤 팔꿈치, intersect: [[BS_T, BS_H], [EL_C, EL_C2]]}
  FS_E: {ko: 큰소매 앞 팔꿈치, intersect: [[FS_T, FS_H], [EL_C, EL_C2]]}
  BS_E2: {ko: 뒤 팔꿈치 들임, from: BS_E, dx: 팔꿈치들임}
  U_MID_T: {ko: 작은소매 위선 바닥, at: ["(FS_T.x + BS_T.x) / 2", "소매산높이 + 언더깊이"]}

lines:
  replace:
    # 한 장 소매의 밑선과 부리는 그대로 두되 작은소매 조각으로 이름을 옮긴다
    - {name: 뒤옆선,   piece: 작은소매, role: outline, pts: [BIC_B, HEM_B]}
    - {name: 앞옆선,   piece: 작은소매, role: outline, pts: [BIC_F, HEM_F]}
    - {name: 소매부리, piece: 작은소매, role: outline, curve: [HEM_B, HEM_C, HEM_F],
       tangents: {HEM_C: [1, 0]}, handles: [[0.4, 0.4], [0.4, 0.4]]}
    # 소매산 곡선을 절개점까지만 쓴다 — 큰소매 조각으로 옮긴다
    - {name: 뒤소매산, piece: 큰소매, role: outline, curve: [BS_T, X_B, SCP],
       tangents: {BS_T: [0, -1], X_B: {along: [SCP, BIC_B]}, SCP: [1, 0]}, handles: [[0.4, 0.4], [0.4, 0.4]]}
    - {name: 앞소매산, piece: 큰소매, role: outline, curve: [SCP, X_F, FS_T],
       tangents: {SCP: [1, 0], X_F: {along: [SCP, BIC_F]}, FS_T: [0, 1]}, handles: [[0.4, 0.4], [0.4, 0.4]]}
  add:
    - {name: 큰소매앞절개, piece: 큰소매, role: outline, curve: [FS_T, FS_E, FS_H],
       tangents: {FS_E: {along: [FS_T, FS_H]}}, handles: [[0.45, 0.45], [0.45, 0.45]]}
    - {name: 큰소매뒤절개, piece: 큰소매, role: outline, curve: [BS_T, BS_E2, BS_H],
       tangents: {BS_E2: {along: [BS_T, BS_H]}}, handles: [[0.45, 0.45], [0.45, 0.45]]}
    - {name: 큰소매밑단, piece: 큰소매, role: outline, pts: [BS_H, FS_H]}
    - {name: 작은소매산, piece: 작은소매, role: outline, curve: [FS_T, U_MID_T, BS_T],
       tangents: {U_MID_T: [-1, 0]}, handles: [[0.5, 0.5], [0.5, 0.5]],
       note: 겨드랑이 밑으로 파이는 작은소매 소매산}

handles:   # 곡선 모양을 원본 도면에 맞춘 값 — tools/fit_all.py
  뒤소매산: [[0.221, 0.724], [0.220, 0.477]]
  큰소매앞절개: [[0.229, 0.231], [0.276, 0.558]]
