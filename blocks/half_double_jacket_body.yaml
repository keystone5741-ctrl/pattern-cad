# 반더블 자켓 몸판 — p.81–82.
#
# 유의사항 (p.82):
#   - **적절한 뒤판 완성 허리둘레**: 가슴둘레 9" 기준으로 55사이즈에 핏하게 만들 때
#     완성 뒤허리둘레는 **6.1/2~6.3/4** 가 적당하다
#   - **디자인용 방울 단추**를 쓸 때는 몸판에 달리는 단추 위치를 **앞중심 쪽 단추보다 1/8 높게**
#     제도한다. 실제 봉제 시 몸판 쪽 단추가 쳐져 보이기 때문이다
#   - 앞판 다트가 2.3/4 보다 짧으면 다트값을 0~1/8, 길면 1/4 정도로 해 **다트 끝이 볼록해지지 않게** 한다
#   - **타이트한 자켓은 엉덩이 포인트를 최소 1 이상 올려** 제도한다. 올리지 않으면 엉덩이둘레가 작아진다
#   - **라펠을 직선으로 제도하면 매니쉬**, **다트를 넣으면 곡선이 되어 여성스러운** 디자인이 된다.
#     칼라 옆 다트는 **1/4~5/8**. 1/8 로는 봉제 시접을 확보할 수 없어 최소 1/4 로 한다.
#     더 크게 곡을 주려면 다트가 아니라 **라펠을 절개**해 만든다
#   - **앞중심~앞마이 거리**: 반더블 **1.1/2~2**, 더블 **2.3/4~3**
