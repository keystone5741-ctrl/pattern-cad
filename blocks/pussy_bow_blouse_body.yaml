# 푸시 보우 블라우스 몸판 — p.55–56.
#
# 유의사항 (p.56):
#   - **뒤중심을 1/2 이상 들이면** 뒤중심이 일자로 내려오면서 **어깨 끝점이 눌려** 착용 시 불편해진다.
#     **뒤중심을 치는 것과 뒤옆목점을 올리는 것은 뒤중심 기장이 늘어나는 같은 결과**다
#   - **신체 품둘레(팔 포함) 37.1/2**. 몸판 품둘레가 신체 품둘레보다 **2 이하로만 커지면**
#     여유가 없어 활동성이 없는 옷이 된다
#   - **뒤암홀**: 뒤품너비는 **어깨끝점에서 수직으로 내려온 선보다 1/2 가량 들어간** 지점이
#     안정적이다. 어깨에 비해 품이 너무 작으면 뒤암홀이 어색해진다
#   - **가슴둘레와 뒤품의 차이**: 피트되는 디자인은 최소 2, 오버사이즈는 대략 3 차이가
#     적절한 뒤암홀을 만든다 (여기서는 옆선~뒤품선 거리로 확인한다)
#   - **소매길이 수정 두 가지**: ① 소매통을 늘리지 않고 — 소매의 1/3 지점을 수평 절개해
#     위로 벌리고 블렌딩(소매산이 높아진다. 과하면 소매산이 처져 비리)
#     ② 소매통을 늘리며 — 소매통선 밑을 수평 절개해 벌린 다음 소매 중간에서도 절개해 나눠 전개
