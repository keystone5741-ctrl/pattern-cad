# 제허리 스커트 원형 (Basic Skirt) — 포트폴리오 p.4–6.
#
# 앞·뒤판이 한 직사각형 안에 있다: 앞중심 x=0, 옆선 x=앞폭, 뒤중심 x=앞폭+뒤폭. y 는 허리선에서 아래.
#   앞폭 = H/4 − 1/4,  뒤폭 = H/4 + 1/4  (H 는 패턴 엉덩이둘레 = 신체 + 여유)
#   허리: W/4 + 이세(1/8). 다트 분량 = 폭 − (W/4 + 이세) − 옆선들임(3/4) 을 다트 두 개에 나눈다
#   다트 위치: 허리선을 3등분. 앞중심쪽 다트가 짧고(3.1/2, 4) 뒤중심쪽 다트가 길다(4.3/4, 4.3/8)
#   다트 끝은 옆솔기 쪽으로 1/8 기울인다 (p.5: 몸판 비율에 맞아 자연스러운 다트)
#   옆선은 허리에서 3/4 들어가고 1/4 올라가 엉덩이선까지 곡으로, 아래는 수직. 뒤중심 허리 1/4 내림
#   지퍼끝 = 엉덩이선, 겹트임 폭 2 · 엉덩이선 아래 7 부터 · 덧단 사선(뒤중심 3 위 → 바깥 1 위)
# 유의사항(p.4): 허리 이세는 원단 밀도에 따라 0~1/8(새틴·실크) / 1/8~1/4(모·트위드). 앞다트는 오목, 뒤다트는 볼록하게 곡으로 제도하면 좋으나
#   메인 생산에서는 직선. 다트량과 길이는 비례하게. 보조개 현상은 옆솔기 곡 최대 1", 그래도 남으면 옆솔기를 앞판 쪽으로 최대 1/2 옮겨 앞판을 줄인다.
name: 제허리 스커트 원형
id: skirt_basic
category: skirt
units: inch
source: reference/portfolio.pdf p.4

measurements:
  W:          {ko: 허리둘레(신체), value: 26}
  H:          {ko: 엉덩이둘레(신체), value: 35.1/2}
  허리여유:   {value: 1/2, note: 패턴 허리 26.1/2 — 4 등분하면 1/8 이세}
  엉덩이여유: {value: 1/2, note: 패턴 엉덩이 36}
  엉덩이길이: {value: 7.1/2}
  기장:       {value: 18, note: 허리선에서 밑단. 브랜드에 따라 (오비 + 옆솔기선) 로 재기도 함 (p.5)}
  앞뒤차:     {value: 1/4, note: 앞폭 = H/4 − 이 값, 뒤폭 = H/4 + 이 값}
  옆선들임:   {value: 3/4, note: 허리에서 옆선이 들어가는 양}
  옆선올림:   {value: 1/4}
  뒤중심허리내림: {value: 1/4}
  앞다트길이1: {value: 3.1/2, note: 앞중심쪽}
  앞다트길이2: {value: 4,     note: 옆솔기쪽}
  뒤다트길이1: {value: 4.3/4, note: 뒤중심쪽}
  뒤다트길이2: {value: 4.3/8, note: 옆솔기쪽}
  다트끝옮김: {value: 1/8, note: 다트 끝을 옆솔기 쪽으로}
  지퍼끝올림: {value: 1/4, note: 지퍼끝은 엉덩이선에서 1/4 위 (p.5)}
  겹트임폭:   {value: 2, note: 시접은 3 이상 (p.5)}
  겹트임위치: {value: 7, note: 엉덩이선 아래}
  겹트임사선위: {value: 3, note: 덧단 윗변이 뒤중심에서 시작하는 높이 (겹트임 위)}
  겹트임사선끝: {value: 1, note: 덧단 윗변 바깥 끝 높이 (겹트임 위)}
  # 파생
  패턴H:      {formula: "H + 엉덩이여유"}
  앞폭:       {formula: "패턴H/4 - 앞뒤차"}
  뒤폭:       {formula: "패턴H/4 + 앞뒤차"}
  허리4:      {formula: "(W + 허리여유)/4", note: W/4 + 이세}
  앞다트폭:   {formula: "(앞폭 - 허리4 - 옆선들임)/2"}
  뒤다트폭:   {formula: "(뒤폭 - 허리4 - 옆선들임)/2"}
  앞허리길이: {formula: "앞폭 - 옆선들임", note: 앞중심에서 옆선 허리점까지 (다트 포함)}
  뒤허리길이: {formula: "뒤폭 - 옆선들임"}

points:
  # 틀
  CF_W:    {ko: 앞중심 허리점,   at: [0, 0]}
  SS_W0:   {ko: 옆선 허리 틀점,  at: [앞폭, 0]}
  CB_W0:   {ko: 뒤중심 허리 틀점, at: ["앞폭 + 뒤폭", 0]}
  CF_H:    {ko: 앞중심 엉덩이점, at: [0, 엉덩이길이]}
  SS_H:    {ko: 옆선 엉덩이점,   at: [앞폭, 엉덩이길이]}
  CB_H:    {ko: 뒤중심 엉덩이점(지퍼끝), at: ["앞폭 + 뒤폭", 엉덩이길이]}
  CF_HEM:  {ko: 앞중심 밑단점,   at: [0, 기장]}
  SS_HEM:  {ko: 옆선 밑단점,     at: [앞폭, 기장]}
  CB_HEM:  {ko: 뒤중심 밑단점,   at: ["앞폭 + 뒤폭", 기장]}
  # 허리
  SS_WF:   {ko: 앞 옆선 허리점,  at: ["앞폭 - 옆선들임", "-옆선올림"]}
  SS_WB:   {ko: 뒤 옆선 허리점,  at: ["앞폭 + 옆선들임", "-옆선올림"]}
  CB_W:    {ko: 뒤중심 허리점,   at: ["앞폭 + 뒤폭", 뒤중심허리내림]}
  # 앞 다트 (허리선 3등분)
  FD1_C:   {ko: 앞다트1 중심(앞중심쪽), along: [CF_W, SS_WF], ratio: "1/3"}
  FD1_L:   {from: FD1_C, dx: "-앞다트폭/2"}
  FD1_R:   {from: FD1_C, dx: "앞다트폭/2"}
  FD1_T:   {ko: 앞다트1 끝, from: FD1_C, dx: 다트끝옮김, dy: 앞다트길이1}
  FD2_C:   {ko: 앞다트2 중심(옆솔기쪽), along: [CF_W, SS_WF], ratio: "2/3"}
  FD2_L:   {from: FD2_C, dx: "-앞다트폭/2"}
  FD2_R:   {from: FD2_C, dx: "앞다트폭/2"}
  FD2_T:   {ko: 앞다트2 끝, from: FD2_C, dx: 다트끝옮김, dy: 앞다트길이2}
  # 뒤 다트 (뒤중심에서 3등분)
  BD1_C:   {ko: 뒤다트1 중심(뒤중심쪽), along: [CB_W, SS_WB], ratio: "1/3"}
  BD1_L:   {from: BD1_C, dx: "-뒤다트폭/2"}
  BD1_R:   {from: BD1_C, dx: "뒤다트폭/2"}
  BD1_T:   {ko: 뒤다트1 끝, from: BD1_C, dx: "-다트끝옮김", dy: 뒤다트길이1}
  BD2_C:   {ko: 뒤다트2 중심(옆솔기쪽), along: [CB_W, SS_WB], ratio: "2/3"}
  BD2_L:   {from: BD2_C, dx: "-뒤다트폭/2"}
  BD2_R:   {from: BD2_C, dx: "뒤다트폭/2"}
  BD2_T:   {ko: 뒤다트2 끝, from: BD2_C, dx: "-다트끝옮김", dy: 뒤다트길이2}
  # 겹트임
  ZIP_END: {ko: 지퍼끝, at: ["앞폭 + 뒤폭", "엉덩이길이 - 지퍼끝올림"]}
  ZIP_END_N: {from: ZIP_END, dx: -0.25}
  VENT_T:  {ko: 겹트임 위(뒤중심), at: ["앞폭 + 뒤폭", "엉덩이길이 + 겹트임위치"]}
  VENT_O:  {ko: 겹트임 바깥 위, at: ["앞폭 + 뒤폭 + 겹트임폭", "엉덩이길이 + 겹트임위치 - 겹트임사선끝"]}
  VENT_S:  {ko: 덧단 사선 시작, at: ["앞폭 + 뒤폭", "엉덩이길이 + 겹트임위치 - 겹트임사선위"]}
  VENT_OH: {ko: 겹트임 바깥 밑단, at: ["앞폭 + 뒤폭 + 겹트임폭", 기장]}

lines:
  # 안내선
  - {name: 허리기준선, role: construction, pts: [CF_W, CB_W0]}
  - {name: 엉덩이선,   role: construction, pts: [CF_H, CB_H]}
  - {name: 옆선기준,   role: construction, pts: [SS_W0, SS_H]}
  # 앞판
  - {name: 앞중심선, piece: 앞판, role: fold, pts: [CF_W, CF_HEM]}
  - {name: 앞허리선1, piece: 앞판, role: outline, pts: [CF_W, FD1_L]}
  - {name: 앞허리선2, piece: 앞판, role: outline, pts: [FD1_R, FD2_L]}
  - {name: 앞허리선3, piece: 앞판, role: outline, pts: [FD2_R, SS_WF], note: 다트를 접은 뒤 허리선을 곡으로 정리한다}
  - {name: 앞다트1, piece: 앞판, role: dart, pts: [FD1_L, FD1_T, FD1_R]}
  - {name: 앞다트2, piece: 앞판, role: dart, pts: [FD2_L, FD2_T, FD2_R]}
  - {name: 앞옆선위, piece: 앞판, role: outline, curve: [SS_WF, SS_H],
     tangents: {SS_WF: [0.35, 1], SS_H: [0, 1]}, handles: [[0.31, 0.20]]}
  - {name: 앞옆선아래, piece: 앞판, role: outline, pts: [SS_H, SS_HEM]}
  - {name: 앞밑단, piece: 앞판, role: outline, pts: [CF_HEM, SS_HEM]}
  # 뒤판
  - {name: 뒤중심선, piece: 뒤판, role: outline, pts: [CB_W, CB_HEM]}
  - {name: 지퍼끝, piece: 뒤판, role: notch, pts: [ZIP_END, ZIP_END_N]}
  - {name: 뒤허리선1, piece: 뒤판, role: outline, pts: [CB_W, BD1_R]}
  - {name: 뒤허리선2, piece: 뒤판, role: outline, pts: [BD1_L, BD2_R]}
  - {name: 뒤허리선3, piece: 뒤판, role: outline, pts: [BD2_L, SS_WB]}
  - {name: 뒤다트1, piece: 뒤판, role: dart, pts: [BD1_L, BD1_T, BD1_R]}
  - {name: 뒤다트2, piece: 뒤판, role: dart, pts: [BD2_L, BD2_T, BD2_R]}
  - {name: 뒤옆선위, piece: 뒤판, role: outline, curve: [SS_WB, SS_H],
     tangents: {SS_WB: [-0.35, 1], SS_H: [0, 1]}, handles: [[0.20, 0.33]]}
  - {name: 뒤옆선아래, piece: 뒤판, role: outline, pts: [SS_H, SS_HEM]}
  - {name: 뒤밑단, piece: 뒤판, role: outline, pts: [SS_HEM, CB_HEM]}
  - {name: 겹트임덧단, piece: 뒤판, role: outline, pts: [VENT_S, VENT_O, VENT_OH, CB_HEM]}
  - {name: 겹트임표시, piece: 뒤판, role: mark, pts: [VENT_T, VENT_O]}
