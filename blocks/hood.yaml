# 후드 — p.59–60.
#
# 유의사항 (p.60):
#   - **Ⓐ점(앞목점)~후드까지의 거리**는 한 장 후드 최소 **3"**, 두 장 후드 최소 **2.1/2"**.
#     이보다 작으면 후드 모양이 **고깔처럼 튀어나온다**
#   - **후드 밑선은 네크보다 1/8 작게** 제도해 늘려 봉제한다. 후드 밑선이 바이어스라 늘어나기 때문
#   - 후드를 제도할 때 **옆목점을 2cm 이상 이동하면** 후드가 목에서부터 퍼져 올라가지 않고
#     어깨 쪽에서 일자로 올라가는 형태가 된다 — 크게 이동하지 않는다
#   - **뒷목점에서 수직으로 2" 가량 올라가** 후드 네크 곡선을 제도한다. 올라가는 길이에 따라
#     후드 세로길이가 바뀌고, **2" 이상 올리면 목옆점~머리마루점 폭이 줄어든다.**
#     네크길이가 후드 옆통과 같이 움직이므로 너무 크거나 작아지지 않게 한다
#   - **후드 세로길이 = 신체 목옆점~머리마루점(정수리) + 1~2" 여유.**
#     2"보다 커질수록 후드가 정수리에 닿고 남는 분량이 옆으로 퍼진다
#   - **두 장 후드 절개선**: 뒷목에서 **1.3/4** 로 시작해 머리마루점으로 가면서 **2.1/4** 로 커지고
#     앞쪽으로 **2"** 폭으로 뻗어나간다. 그 폭으로 후드 중심 길이를 일직선으로 제도해 골로 편다
#
# 좌표계: 앞 얼굴선 위 끝이 원점 근처, +x 가 뒤중심 쪽, y 아래.
name: 후드
id: hood
category: part
units: inch
source: reference/portfolio.pdf p.59

measurements:
  네크길이:   {value: 9, note: 몸판 앞목선 + 뒤목선 (반쪽) — 스타일에서 자동}
  밑선줄임:   {value: 1/8, note: 후드 밑선을 네크보다 이만큼 작게 — 바이어스라 늘어난다}
  후드밑선:   {formula: "네크길이 - 밑선줄임"}
  목옆머리마루: {value: 12.1/2, note: 신체 목옆점~머리마루점(정수리)}
  세로여유:   {value: 1.1/2, note: 1~2. 2보다 커질수록 후드가 정수리에 닿고 남는 분량이 옆으로 퍼진다}
  후드높이:   {formula: "목옆머리마루 + 세로여유"}
  뒷목올림:   {value: 2, note: 뒷목점에서 수직으로 올라가는 양. 2 이상이면 목옆~머리마루 폭이 줄어든다}
  앞선기울기: {value: 1.1/4, note: 얼굴선 위쪽이 뒤로 눕는 양}
  형식:       {choice: 한장, options: [한장, 두장]}
  앞목거리:   {value: 3, note: 앞목점(Ⓐ)에서 후드까지. 한 장 3 이상, 두 장 2.1/2 이상}
  절개뒷목:   {value: 1.3/4, note: 두 장 후드 절개선 폭 — 뒷목}
  절개머리:   {value: 2.1/4, note: 머리마루점}
  절개앞:     {value: 2,     note: 앞쪽}

points:
  F_B:  {ko: 얼굴선 아래(앞목점 자리), at: [0, 후드높이]}
  CB_B: {ko: 뒤중심 아래, circle: {center: F_B, radius: 후드밑선}, y: "후드높이 - 뒷목올림", side: right,
         note: 밑선은 곡선이라 실제 길이는 이 현보다 조금 길다 — 스타일에서 확인한다}
  CB_T: {ko: 뒤중심 위, at: ["CB_B.x", 0]}
  F_T:  {ko: 얼굴선 위, at: [앞선기울기, 0]}
  TOP_M: {ko: 머리마루점, at: ["(F_T.x + CB_T.x) / 2", "-앞선기울기 / 2"]}
  # 두 장 후드 절개선 (뒤중심에서 안쪽으로 폭만큼 들어온 선)
  SP_B: {ko: 절개선 뒷목, from: CB_B, dx: "-절개뒷목"}
  SP_M: {ko: 절개선 머리마루, at: ["TOP_M.x + 절개머리 / 2", "TOP_M.y + 절개머리 / 3"]}
  SP_F: {ko: 절개선 앞, from: F_T, dx: 절개앞}

lines:
  - {name: 얼굴선, role: outline, pts: [F_T, F_B]}
  - {name: 후드윗선, role: outline, curve: [F_T, TOP_M, CB_T],
     tangents: {F_T: [1, -0.5], TOP_M: [1, 0], CB_T: [0.3, 1]}, handles: [[0.45, 0.45], [0.45, 0.45]]}
  - {name: 뒤중심선, role: fold, pts: [CB_T, CB_B], note: 한 장 후드는 골}
  - {name: 후드밑선, role: outline, curve: [F_B, CB_B],
     tangents: {F_B: [1, -0.25], CB_B: [1, -0.5]}, handles: [[0.4, 0.4]]}
  - {name: 두장절개선, role: construction, curve: [SP_B, SP_M, SP_F],
     tangents: {SP_M: [-1, 0]}, handles: [[0.45, 0.45], [0.45, 0.45]],
     note: 두 장 후드일 때만 쓴다 — 뒷목 1.3/4 → 머리마루 2.1/4 → 앞 2}
