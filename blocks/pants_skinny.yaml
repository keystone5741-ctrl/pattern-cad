# 스키니 팬츠 — p.39–40. 힙본 팬츠에서 허벅지·엉덩이를 **신체보다 작게** 제도한다.
#
# 유의사항 (p.39):
#   - **주머니 입구는 몸판보다 1/4~1/2 여유**를 준다. 스키니는 타이트해서 제 길이로 제도하면
#     주머니 입구가 늘어나지 않아 쓰기 불편하다. **원단이 두꺼울수록 여유를 더** 준다
#   - **더 타이트하게**: 신축성에 따라 다르지만 보통 신체 사이즈보다 **1~1.1/2 작게** 제도한다.
#     허벅지둘레를 줄이는 것은 **샅의 길이를 줄이는 것과 같다.**
#     샅을 줄이고도 허벅지를 더 줄이고 싶으면 **엉덩이둘레를 줄여야** 한다
#     (그래서 패턴 엉덩이 34.1/2 < 신체 35.1/2 — 엉덩이여유가 음수다)
