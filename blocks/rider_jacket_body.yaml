# 라이더 자켓 몸판 — p.95–98. 짧은 기장, 지퍼 여밈, 요크.
#
# 유의사항 (p.96):
#   - **피트되는 디자인의 허리 다트는 1 이상** 들어가야 슬림한 실루엣이 되지만,
#     **1.3/8 보다 커지면 무리한 선이 되어 보조개 현상**이 생기고 부자연스럽게 허리가 들어간다
#   - **뒤중심**: 오버사이즈는 뒷목점에서 밑단까지 사선으로 제도해도 되지만
#     **피트되는 디자인에서 직선으로 제도하면 뒤판이 뜬다.** 따라서 **요크는 직선**,
#     요크 끝부터 **3/4 들어간 허리 포인트까지는 기존 뒤중심 곡선**이 되도록 그린다
#   - **허리 포인트를 너무 올리면 봉제 후 뒤허리가 뜬다.** 최근 여성 평균 키가 커져 평균 등길이가
#     15 보다 길어졌기 때문에 굳이 올리지 않아도 올린 효과가 난다
#   - 허리 밑이 쏙 들어간 실루엣은 절개선 기준으로 위아래를 각 1/4 씩 줄인다.
#     **골 패턴은 한 곳에서 1/4 을 줄이지 않고 1/8 씩 나눠 M.P** 한 다음 봉제한다
#   - **지퍼 분량이 총 1cm 면 몸판을 1cm 줄인다.** 이 디자인은 시다 절개를 따라 지퍼가 물리므로
#     우아에서 총 1cm 를 줄여야 둘레가 변하지 않는다
#   - **앞판 다트를 많이 주면 지퍼선과 길이 차이가 커지므로 3/8 이상 주지 않는다.**
#     곡선에 지퍼를 봉제하기 어렵고 양쪽 길이가 달라진다
#
# 유의사항 (p.97–98):
#   - **라이더 여밈분은 1/8 올려 제도한다.** 지퍼를 잠그기보다 열어 입는 경우가 많아
#     일직선이나 내려서 제도하면 칼라와 간격이 너무 벌어져 보인다
#   - **소매 절개선**은 앞소매 끝점이 아니라 **소매 중심선에서 2.3/4~3** 되게 잡는 것이 정확하다.
#     절개된 앞소매 분량을 뒤소매에 붙여 제도한다
#   - **요크 절개선과 어깨끝점 사이가 너무 좁으면 봉제가 용이하지 않다** (1.1/8 이상)
#   - 요크선이 있으면 **견갑 M.P 를 요크 절개로** 처리할 수 있다 (요크선이 없을 때는 찝벌옮내)
#   - 앞판 절개선이 BP 를 넘어가면 넘어간 만큼 이세 처리를 할 수 있으나,
#     **스티치나 쌈솔로 봉제하면 시접이 몸판으로 들어가 이세 처리가 어렵다**
extends: jacket_body.yaml
name: 라이더 자켓 몸판
id: rider_jacket_body
source: reference/portfolio.pdf p.95

measurements:
  여유:         {value: 2.3/8, note: 패턴 가슴 35.7/8}
  진동깊이:     {value: 8.1/2}
  기장:         {value: 20}
  뒤어깨끝너비: {value: 7.1/2, note: 어깨너비 15}
  앞품:         {value: 13.1/8}
  가슴다트폭:   {value: 1/4}
  앞허리다트폭: {value: 3/8, note: 지퍼선과 길이차가 커지므로 3/8 이상 주지 않는다}
  뒤허리다트폭: {value: 3/8}
  옆선허리들임: {value: 1/32, note: 패턴 허리 34.1/4}
  엉덩이여유:   {value: -1/16, note: 기장이 짧아 엉덩이선까지 오지 않는다. 밑단 35.5/8}
  밑단벌림:     {value: 0}
  힙포인트올림: {value: 0, note: 너무 올리면 봉제 후 뒤허리가 뜬다}
  여밈올림:     {value: 1/8, note: 라이더는 여밈분을 올려 제도한다 — 열어 입어도 칼라와 간격이 벌어지지 않게}
  낸단폭:       {value: 1.1/4}
  지퍼분량:     {value: 3/8, note: 약 1cm. 몸판에서 같은 양을 줄여야 둘레가 유지된다}
  요크깊이:     {value: 3.1/2, note: 요크 절개선과 어깨끝점 사이는 1.1/8 이상}
  요크어깨간격: {value: 1.1/8, note: 이보다 좁으면 봉제가 용이하지 않다}
  소매절개위치: {value: 2.7/8, note: 소매 중심선에서 2.3/4~3 — 절개선을 앞으로 보낸다}

points:
  EXT_T: {ko: 낸단 위끝, at: ["-낸단폭", "FNP.y - 여밈올림"]}
  EXT_B: {ko: 낸단 아래, at: ["-낸단폭", "HEM_CF.y - 여밈올림"]}
  YK_CB: {ko: 요크 뒤중심, at: ["BL_CB.x", "BNP.y + 요크깊이"]}
  YK_AH: {ko: 요크 암홀쪽, at: ["전폭 - 뒤품/2", "BNP.y + 요크깊이 + 1/2"]}

lines:
  # 라이더는 테일러드 라펠이 없다 — 지퍼 여밈이라 앞목선이 그대로 외곽이 된다 (p.95 도면)
  remove: [라펠꺾임선, 고지라인, 라펠노치, 라펠외곽]
  replace:
    - {name: 낸단, piece: 앞판, role: outline, pts: [EXT_T, EXT_B],
       note: 지퍼 여밈분. 열어 입어도 칼라와 벌어지지 않게 1/8 올려 그린다}
  add:
    - {name: 앞목선, piece: 앞판, role: outline, curve: [SNP_F, G_NF, FNP],
       tangents: {SNP_F: {perp: [SNP_F, SP_F]}, FNP: [-1, 0]}, handles: [[0.2, 0.55], [0.29, 0.2]]}
    - {name: 낸단위선, piece: 앞판, role: outline, pts: [FNP, EXT_T]}
    - {name: 뒤요크선, piece: 뒤판, role: mark, pts: [YK_CB, YK_AH],
       note: 요크는 직선. 견갑 M.P 를 이 절개로 처리한다}
