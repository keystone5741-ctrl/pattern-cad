# 기본 셔츠 칼라 블라우스 몸판 — 포트폴리오 p.48. 상의 몸판 기본틀에서 바뀐 것만 적는다.
#
# 도면(점선 = 시추니 원형, 실선 = 블라우스)에서 읽은 변화:
#   진동깊이 8.1/4 (원형보다 1/4 얕음) · 겨드랑점 옆으로 1/4, 아래로 1/8
#   앞목: 옆목점 1/8 올림, 앞목점 3/4 내림 · 뒤목: 뒷목점 1/16 올림, 옆목점 1/8 올림, 너비 1/4 넓힘
#   어깨: 뒤어깨끝 1/4 연장, 뒤어깨다트는 M.P(이세) 처리, 앞어깨 길이 = 뒤어깨길이
#   가슴다트 3/4 (나머지는 M.P) · 앞뒤 허리다트 1"(1/2+1/2) · 옆선 허리 들임 · 엉덩이 여유
#   뒤중심: 가슴선 3/8 → 허리선 3/4 들어가고 밑단까지 수직 · 기장 24 · 앞내림 1/4 · 밑단 곡선 · 단작 1"
# p.48 도면은 축척이 12.4~13.5pt/in 로 들쭉날쭉해 실측은 ±5% 오차. 표기 치수를 따르고, 표기 없는 것은
# "실측" 으로 적었다 → docs/drafting_notes.md 미확인 항목.
extends: top_body.yaml
name: 셔츠 칼라 블라우스 몸판
id: shirt_collar_blouse_body
source: reference/portfolio.pdf p.48

measurements:
  # 여유는 원형 그대로 2.1/2 (패턴 가슴 36). 사이즈표 표기는 35.1/2 로 1/2 차이 —
  # 도면 겹침 검증(verify_block)은 36 에서 맞는다. docs/drafting_notes.md 미확인 항목.
  진동깊이:     {value: 8.1/4}
  기장:         {value: 24}
  옆선허리들임: {value: 1/2, note: 패턴 허리 30}
  엉덩이여유:   {value: 7/16, note: 패턴 엉덩이 37.3/4}
  뒤품:         {value: 14.1/2, note: 뒤암홀이 견갑 높이에서 원형보다 1/4 바깥 (M.P 1/4)}
  앞옆목점내림: {value: 1/8, note: 원형 1/4 에서 1/8 올림}
  앞목내림:     {value: 3/4, note: 앞목점을 원형보다 내림}
  뒤목점올림기준: {value: 1/16}
  뒤목높이:     {value: 1.1/8, note: 옆목점 1/8 올림}
  뒤목너비기준: {value: 3.1/4, note: 1/4 넓힘}
  뒤어깨끝너비: {value: 7.3/4, note: 뒤어깨끝 1/4 연장}
  뒤어깨다트폭: {value: 1/4, note: 다트로 접지 않고 M.P(이세) — 어깨선은 직선}
  앞어깨길이:   {formula: "뒤어깨길이", note: 도면 표기 '뒤어깨길이'. 뒤 다트가 이세로 가므로 앞도 같은 길이}
  가슴다트폭:   {value: 3/4, note: 원형 1.1/4 중 3/4 만 다트, 나머지 M.P}
  단작폭:       {value: 1, note: 앞중심 좌우 1/2}

points:
  PL_L_TOP: {ko: 단작 왼쪽 위,   at: ["-단작폭/2", "FNP.y"]}
  PL_L_BOT: {ko: 단작 왼쪽 아래, at: ["-단작폭/2", "HEM_CF.y"]}
  PL_R_TOP: {ko: 단작 오른쪽 위, at: ["단작폭/2", "FNP.y"]}
  PL_R_BOT: {ko: 단작 오른쪽 아래, at: ["단작폭/2", "HEM_CF.y"]}

lines:
  add:
    - {name: 단작왼쪽, piece: 앞판, role: mark, pts: [PL_L_TOP, PL_L_BOT]}
    - {name: 단작오른쪽, piece: 앞판, role: mark, pts: [PL_R_TOP, PL_R_BOT]}
