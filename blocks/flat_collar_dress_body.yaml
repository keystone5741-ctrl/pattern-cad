# 플랫 칼라 원피스 — p.69–70.
#
# 유의사항 (p.70):
#   - **칼라 길이를 짧게 제도하는 이유**: 몸판과 칼라를 같은 길이로 제도하면 소재에 따라
#     **칼라의 목옆점 부위가 꺾인다.** 0.2~0.6cm(**1/16~1/4**) 짧게 제도해 늘려 봉제한다.
#     칼라가 비바이어스 결이라 늘어지므로 늘림양을 준다
#   - **네크라인 겹침에 따른 스탠드분 변화**: 플랫칼라의 스탠드분은 **앞·뒤 어깨선 끝점의
#     겹침분량과 칼라 폭**에 따라 달라진다. 네크라인이 파인 정도에 따라 겹침 정도도 달라지므로
#     기본 네크라인을 기준으로 겹침과 칼라 폭에 따른 외곽둘레·스탠드분의 변화를 이해해야 한다.
#     칼라 폭 예: 7cm(2.3/4) · 9cm(3.1/2) · 10cm(4)
