# 원버튼 테일러드 자켓 몸판 — p.83–84.
#
# 유의사항 (p.84):
#   - **마꾸라지**는 자켓 어깨를 올라오게 하려고 덧대는 것이다. 이세로 인한 지글거림을 보완하고,
#     피트되는 자켓은 어깨패드를 거의 쓰지 않고 마꾸라지 정도로 형태를 잡는 것이 보통이다.
#     **오버사이즈로 어깨 치수가 원형에서 1/2 이상 커지면 패드를 필수로** 넣어야 어깨가 쳐지지 않는다
#   - **앞내림분**은 도식화에서 중심이 벌어진 위치를 확인하고 결정한다
#   - **자켓의 칼라 폭은 최소 2.3/4 이상**. 이보다 작으면 칼라는 좁고 몸판은 넓어 보여 밸런스가 무너진다
#   - **라펠 다트량은 최대 5/8**. 곡선을 더 강하게 하려면 라펠을 절개해 분량을 늘린다
#   - **뒤소매를 제도할 때 상동선을 맞추면 소매 여유분량이 생겨 우글거릴 수 있다.**
#     몸판 상동선을 내려 제도하면 여유분량이 적어지고, 올려 제도하면 여유분량이 생긴다
