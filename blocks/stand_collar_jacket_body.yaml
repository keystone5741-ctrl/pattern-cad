# 스탠 칼라 테일러드 자켓 몸판 — p.89–90. 라펠 없이 칼라가 선다.
#
# 유의사항 (p.90):
#   - **세워지는 칼라의 뒤중심 너비는 1~1.1/2 (기본 1.1/4)** 가 일반적이다
#   - **프린세스 라인이 있을 때는 앞품을 1/8 가량 잡아준다.** 인체 구조상 쇄골 밑 꺼진 분량을
#     잡아주기 위해서다. 두꺼운 원단이면 1/4 까지 커지지만 두께 때문에 크게 티가 나지 않는다
#   - **피트한 실루엣 자켓의 뒤판 치수**: 뒤가슴 8.1/4~8.1/2 · 뒤허리 6.1/2~6.3/4 · 뒤엉덩이 9~9.1/4
#   - **힙라인 겹침분 포인트를 일반적으로 1 가량 올리는데 앞보다 뒤를 높게** 잡는 경향이 있다.
#     인체 구조상 뒤는 엉덩이가 있어 앞보다 입체적이어야 하기 때문. 다만 대부분 같게 올린다
extends: jacket_body.yaml
name: 스탠 칼라 테일러드 자켓 몸판
id: stand_collar_jacket_body
source: reference/portfolio.pdf p.89

measurements:
  여유:         {value: 7/8, note: 패턴 가슴 34.3/8}
  진동깊이:     {value: 8.5/8}
  기장:         {value: 26}
  뒤어깨끝너비: {value: 7.3/8, note: 어깨너비 14.3/4}
  프린세스앞품잡음: {value: 1/8, note: 쇄골 밑 꺼진 분량 (두꺼운 원단은 1/4)}
  앞품:         {formula: "앞품기준 - 프린세스앞품잡음"}
  앞품기준:     {value: 13.1/8}
  허리다트폭:   {value: 1.1/8}
  옆선허리들임: {value: 3/32, note: 패턴 허리 29.1/2}
  엉덩이여유:   {value: 3/4, note: 패턴 엉덩이 37.3/8}
  밑단벌림:     {value: 15/16, note: 패턴 밑단 41.1/8}
  힙포인트올림: {value: 1, note: 뒤를 앞보다 높게 잡기도 하지만 대부분 같게}
  라펠끝높이:   {value: 2.1/2, note: 라펠이 없으므로 낸단 위끝 높이로만 쓴다}
  # --- 확인용 (피트한 실루엣)
  완성뒤가슴반: {formula: "뒤반폭", note: 8.1/4~8.1/2}
  완성뒤허리반: {formula: "뒤반폭 - 옆선허리들임 - 뒤허리다트폭", note: 6.1/2~6.3/4}
  완성뒤엉덩이반: {formula: "뒤엉덩이반", note: 9~9.1/4}

lines:
  remove: [라펠꺾임선, 고지라인, 라펠노치, 라펠외곽]
  add:
    # 라펠이 없다. 앞목선을 되살리고 낸단 위끝까지 이어 준다
    - {name: 앞목선, piece: 앞판, role: outline, curve: [SNP_F, G_NF, FNP],
       tangents: {SNP_F: {perp: [SNP_F, SP_F]}, FNP: [-1, 0]}, handles: [[0.2, 0.55], [0.29, 0.2]]}
    - {name: 앞목선연장, piece: 앞판, role: outline, pts: [FNP, LP_BREAK], note: 라펠 없이 칼라가 목선에 선다}
