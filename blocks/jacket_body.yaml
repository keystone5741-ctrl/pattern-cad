# 자켓 몸판 기본틀 — p.74–78 테일러드 자켓을 기준으로. 9종 자켓이 모두 이것을 상속한다.
#
# 유의사항 (p.75–76):
#   - **앞뒤 품 차이**: 시추니 원형은 1/2 이지만 자켓은 **앞이 벌어지는 것을 고려해 5/8~3/4**.
#     1/2 보다 크게 주면 옆에서 봤을 때 소매가 앞으로 돌아간 듯이 완성된다
#   - **엉덩이둘레**: 들어간 허리 포인트에서 엉덩이선까지 수직선을 내렸을 때
#     **1/2~3/4 정도의 곡**으로 제도해야 안정적인 실루엣이 된다
#   - **사이바 라인의 허리 다트량은 1~1.3/8** 이 적당하고, **1.1/2 이상이면 무리한 다트량**이다
#   - **엉덩이선 포인트를 높이 올릴수록 엉덩이·밑단 둘레가 커진다.**
#     허리에서 좁았다가 힙에서 넓어지는 여성스러운 라인을 살리려면
#     다트에서 수직으로 내려온 선에서 옆선 쪽으로 **1/8~1/4 이동해 겹침분**을 준다
#   - **칼라 뒤중심 길이는 3 이상**. 뒤 칼라가 꺾이는 지점이 밴드에서 1/2 올라간 위치인데,
#     3 이하면 꺾임분량과 칼라밴드를 덮지 못해 **절개선이 보인다**
#   - **여밈(낸단)분은 단추 끝에서 1/4~3/8 나가는 것이 좋다.** 많이 나가면 라펠이 넘어가면서
#     여밈분이 들릴 수 있다
#   - **앞판 B.P 다트는 1/4 이상 가지 않는 것이 좋다.** 넘으면 주머니가 너무 볼록 튀어나온다
#   - **라펠 고지라인**은 **라펠 선을 1/8~1/4 올려** 그린다. 일자로 그리면 실제보다 쳐져 보인다
#   - **앞주머니(후다)**는 완성 시 일자로 보이도록 **1/4 가량 사선으로 기울여** 제도하고,
#     위치는 **허리와 엉덩이의 중간**이 일반적이다
#   - **칼라 폭이 넓을수록 외곽길이가 길어야(곡을 더 크게)** 칼라가 눌리지 않는다.
#     늘려주지 않으면 꺾이는 위치가 올라가고 칼라가 눌린다
#
# 유의사항 (p.80 아워글라스):
#   - **20대 여성 평균 겨드랑이 둘레는 37.5cm(14.7/8)**. 아이템별로 패턴 암홀둘레에
#     여유분이 얼마나 적당한지 파악해야 불편함이 없다 — 제도할 때 겨드랑이 둘레를 확인한다
#   - **어깨너비가 넓어지며 가슴둘레가 커질 때 진동깊이도 같은 비율로** 움직여야 암홀 길이가
#     짧아지지 않는다. 가슴둘레가 커진 만큼 진동깊이가 늘지 않으면 비율이 무너진다
#   - **옆솔기 허리 포인트**는 가슴둘레에서 수직으로 내려온 지점에서 **1/8~5/8** 들이는 것이 적당하다.
#     5/8 이상이면 옆선 바이어스가 심해져 늘어나거나 쳐진다. 더 줄이려면 **사이바라인으로** 줄인다
#   - **어깨 패드**가 들어가면 **패드의 80% 만큼 어깨끝점을 올린다** (1cm 패드 → 0.8cm).
#     앞뒤 총 1.6cm 를 앞 0.6 / 뒤 1.0 으로 나눠 올려 **어깨 절개선이 앞으로 오게**(어깨선이 뒤로
#     넘어가 보이지 않게) 제도한다
#   - **엉덩이 포인트를 많이 올릴수록** 엉덩이둘레가 커지고 앞뒤 양옆이 항아리처럼 입체적이 된다
#     (아워글라스). 타이트한 자켓은 **엉덩이 포인트를 최소 1 이상 올린다**
#   - 자켓은 진동깊이를 많이 내린다고 활동분량이 확보되는 것이 아니라 **겹등품(겨드랑이너비)**에 따라
#     활동분량이 확보된다
#   - **BP 에서 1 이상 벗어난 곳**에서 입체분량을 잡으면 가슴 입체 형태가 제자리를 벗어나므로
#     **무다트 원형**을 쓰는 것이 바람직하다
#
# 유의사항 (p.88 · p.90):
#   - **뒤판 사이바(절개)라인을 제도할 때 가슴 분량을 1/4~3/8 날린다.** 줄이지 않으면 남는 분량이 생긴다
#   - 디자인이 뒤보다 앞이 여유있어 보일 때 **앞 허리 다트량을 뒤보다 1/4~3/8 적게** 잡는다
#   - **피트한 자켓의 뒤판 치수**: 뒤가슴 8.1/4~8.1/2 · 뒤허리 6.1/2~6.3/4 · 뒤엉덩이 9~9.1/4
#   - **프린세스 라인이 있으면 앞품을 1/8 잡아준다** (쇄골 밑 꺼진 분량). 두꺼운 원단은 1/4 까지
#   - **미까시(안단)**: 목옆점에서 1.1/4~1.1/2, 앞중심에서 3" 되는 지점을 어깨부터 허리선까지
#     완만한 곡선으로 그리고, 허리선부터는 일자로 내려 밑단까지
extends: top_body.yaml
name: 자켓 몸판 기본틀
id: jacket_body
source: reference/portfolio.pdf p.74

measurements:
  여유:         {value: 1.3/4, note: 패턴 가슴 35.1/4}
  진동깊이:     {value: 8.3/4, note: 사이즈표. 도면 눈금 표기는 8.1/4 — docs/drafting_notes.md}
  등길이:       {value: 15}
  엉덩이길이:   {value: 7.1/2}
  기장:         {value: 24.3/8}
  뒤어깨끝너비: {value: 7.7/16, note: 어깨너비 14.7/8}
  앞뒤품차:     {value: 3/4, note: 자켓은 5/8~3/4 (원형은 1/2)}
  앞품:         {value: 13.1/4}
  뒤품:         {formula: "앞품 + 앞뒤품차"}
  가슴다트폭:   {value: 1/4, note: B.P 다트는 1/4 이상 가지 않는다 — 넘으면 주머니가 볼록해진다}
  허리다트폭:   {value: 1.1/4, note: 사이바 라인의 허리 다트량 1~1.3/8 (1.1/2 이상이면 무리)}
  옆선허리들임: {value: 0, note: 허리는 앞·뒤 사이바 다트로만 줄인다 — 패턴 허리 30.1/4}
  엉덩이여유:   {value: 25/32, note: 패턴 엉덩이 38.3/8}
  힙곡:         {value: 5/8, note: 들어간 허리 포인트에서 엉덩이선까지 1/2~3/4 곡}
  사이바겹침:   {value: 3/16, note: 1/8~1/4. 다트에서 수직으로 내려온 선에서 옆선 쪽으로}
  밑단벌림:     {value: -3/32, note: 패턴 밑단 38}
  앞옆밑단올림: {value: 0}
  뒤옆밑단올림: {value: 0}
  앞내림:       {value: 0}
  # --- 여밈 · 라펠
  낸단폭:       {value: 3/4, note: 단추 끝에서 1/4~3/8 나간다}
  단추끝나감:   {value: 3/8}
  첫단추높이:   {formula: "등길이 + 1", note: 꺾임선이 닿는 높이 (허리선 아래 1)}
  밴드폭:       {value: 1.1/4, note: 칼라밴드(스탠드) 폭 — 꺾임선을 옆목점에서 이만큼 연장}
  라펠폭:       {value: 3.1/2}
  라펠끝높이:   {formula: "진동깊이 + 1/2", note: 라펠 끝(고지 노치)이 오는 높이}
  고지길이:     {value: 1.3/4}
  고지올림:     {value: 3/16, note: 1/8~1/4. 고지라인을 올려 그려야 쳐져 보이지 않는다}
  # --- 주머니 (후다)
  주머니폭:     {value: 5.1/2}
  주머니기울기: {value: 1/4, note: 완성 시 일자로 보이도록 사선으로}
  후다높이:     {value: 1.3/4}
  주머니높이:   {formula: "등길이 + 엉덩이길이 / 2", note: 허리와 엉덩이의 중간}
  주머니안쪽:   {value: 1.3/4, note: 앞중심에서 주머니 안쪽 끝까지}
  사이바암홀:   {value: 2.1/2, note: 암홀 위 사이바 시작점 — 겨드랑점에서 위로}
  뒤사이바가슴날림: {value: 5/16, note: 1/4~3/8. 뒤 절개라인에서 가슴 분량을 날린다}
  # --- 어깨 패드
  패드두께:     {value: 0, note: "패드 두께. 0 이면 패드 없음 (1cm ≒ 3/8인치)"}
  패드올림비:   {value: 0.8, note: 패드의 80% 만큼 어깨끝점을 올린다}
  뒤어깨패드올림: {formula: "패드두께 * 패드올림비 * 0.625", note: "앞 0.6 · 뒤 1.0 으로 배분해 어깨선이 뒤로 넘어가 보이지 않게"}
  앞어깨패드올림: {formula: "패드두께 * 패드올림비 * 0.375"}
  뒤어깨끝내림: {formula: "뒤어깨끝내림기준 - 뒤어깨패드올림"}
  뒤어깨끝내림기준: {value: 1/2}
  # --- 힙 포인트
  힙포인트올림: {value: 1, note: 타이트한 자켓은 최소 1 이상 올린다. 올릴수록 엉덩이·밑단이 커진다}
  # --- 미까시 (안단)
  미까시목옆: {value: 1.3/8, note: 목옆점에서 (1.1/4~1.1/2)}
  미까시앞중심: {value: 3, note: 앞중심에서. 어깨~허리선은 완만한 곡, 허리선부터 밑단은 일자}
  # --- 확인용
  평균겨드랑이둘레: {value: 14.7/8, note: 20대 여성 평균 37.5cm — 암홀둘레 여유를 확인한다}

points:
  # --- 힙 포인트를 올린다 (타이트한 자켓은 최소 1)
  HL_SS_F: {ko: 앞 옆선 엉덩이점, at: [앞엉덩이반, "등길이 + 엉덩이길이 - 힙포인트올림"]}
  HL_SS_B: {ko: 뒤 옆선 엉덩이점, at: ["전폭 - 뒤엉덩이반", "등길이 + 엉덩이길이 - 힙포인트올림"]}
  # --- 낸단(여밈)
  EXT_T: {ko: 낸단 위, at: ["-낸단폭", "FNP.y"]}
  EXT_B: {ko: 낸단 아래, at: ["-낸단폭", "HEM_CF.y"]}
  BTN1:  {ko: 첫 단추, at: [0, 첫단추높이]}
  # --- 라펠 꺾임선
  ROLL_T: {ko: 꺾임선 위(어깨 연장), along: [SP_F, SNP_F], dist: "dist(SP_F, SNP_F) + 밴드폭"}
  ROLL_B: {ko: 꺾임선 아래, at: ["-낸단폭", 첫단추높이]}
  SNP_M:  {ko: 꺾임선에 대칭시킨 옆목점, mirror: {of: SNP_F, line: [ROLL_T, ROLL_B]}}
  GORGE:  {ko: 고지 끝, from: SNP_M, dx: "-고지길이", dy: "고지길이 * 0.55 - 고지올림"}
  LAPEL_BASE: {ko: 꺾임선 위 라펠끝 자리, along: [ROLL_T, ROLL_B], ratio: 0.55}
  LAPEL_TIP:  {ko: 라펠 끝, perp: {from: LAPEL_BASE, line: [ROLL_T, ROLL_B], dist: 라펠폭, side: [-1, 0]}}
  # --- 사이바 (프린세스) 절개
  FSB_T: {ko: 앞사이바 시작(암홀), at: ["BP.x + 3/8", "UP2.y - 사이바암홀"]}
  FSB_H: {ko: 앞사이바 밑단, at: ["FWD_C.x + 사이바겹침", "HEM_CF.y"]}
  BSB_T: {ko: 뒤사이바 시작(암홀), at: ["BWD_C.x", "UP2.y - 사이바암홀"]}
  BSB_H: {ko: 뒤사이바 밑단, at: ["BWD_C.x - 사이바겹침", "HEM_CB0.y"]}
  # --- 미까시 (안단)
  MK_T: {ko: 미까시 어깨쪽, along: [SNP_F, SP_F], dist: 미까시목옆}
  MK_W: {ko: 미까시 허리선, at: ["미까시앞중심 - 낸단폭", 등길이]}
  MK_B: {ko: 미까시 밑단, at: ["미까시앞중심 - 낸단폭", "HEM_CF.y"]}
  # --- 주머니 (후다)
  PK_IN:  {ko: 주머니 안쪽 끝, at: [주머니안쪽, 주머니높이]}
  PK_OUT: {ko: 주머니 바깥 끝, at: ["주머니안쪽 + 주머니폭", "주머니높이 - 주머니기울기"]}
  PK_IN2:  {from: PK_IN, dy: 후다높이}
  PK_OUT2: {from: PK_OUT, dy: 후다높이}

lines:
  replace:
    - {name: 앞밑단, piece: 앞판, role: outline, curve: [HEM_CF, HEM_SS_F],
       tangents: {HEM_CF: [1, 0], HEM_SS_F: [1, 0]}, handles: [[0.4, 0.4]]}
  add:
    - {name: 낸단, piece: 앞판, role: outline, pts: [EXT_T, EXT_B], note: 단추 끝에서 1/4~3/8}
    - {name: 낸단밑단, piece: 앞판, role: outline, pts: [EXT_B, HEM_CF]}
    - {name: 라펠꺾임선, piece: 앞판, role: fold, pts: [ROLL_T, ROLL_B]}
    - {name: 고지라인, piece: 앞판, role: outline, pts: [SNP_M, GORGE], note: 1/8~1/4 올려 그린다}
    - {name: 라펠끝선, piece: 앞판, role: outline, pts: [GORGE, LAPEL_TIP], note: 고지 노치에서 라펠 끝까지}
    - {name: 라펠외곽, piece: 앞판, role: outline, curve: [LAPEL_TIP, ROLL_B],
       tangents: {LAPEL_TIP: {along: [ROLL_T, ROLL_B]}, ROLL_B: [0, 1]}, handles: [[0.22, 0.22]]}
    - {name: 앞사이바, piece: 앞판, role: mark, curve: [FSB_T, BP, FWD_C, FSB_H],
       tangents: {FSB_T: [0, 1], BP: [0, 1], FWD_C: [0, 1]}, handles: [[0.3, 0.3], [0.3, 0.3], [0.35, 0.35]]}
    - {name: 뒤사이바, piece: 뒤판, role: mark, curve: [BSB_T, BWD_TOP, BWD_C, BSB_H],
       tangents: {BWD_C: [0, 1]}, handles: [[0.4, 0.4], [0.4, 0.4], [0.4, 0.4]]}
    - {name: 주머니입구, piece: 앞판, role: mark, pts: [PK_IN, PK_OUT]}
    - {name: 후다, piece: 앞판, role: mark, pts: [PK_IN, PK_IN2, PK_OUT2, PK_OUT]}
    - {name: 첫단추, piece: 앞판, role: notch, pts: [BTN1, ROLL_B]}
    - {name: 미까시, piece: 앞판, role: mark, curve: [MK_T, MK_W, MK_B],
       tangents: {MK_W: [0, 1], MK_B: [0, 1]}, handles: [[0.5, 0.5], [0.4, 0.4]],
       note: 목옆점 1.1/4~1.1/2 · 앞중심 3 — 허리선부터 밑단까지는 일자}
