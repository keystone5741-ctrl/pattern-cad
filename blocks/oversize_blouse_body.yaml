# 오버사이즈 블라우스 몸판 — p.51–52. **시추니 무다트 원형**으로 제도한다.
#
# 유의사항 (p.52):
#   - 오버사이즈 가슴둘레 = [신체 가슴둘레] + [오버분량 **30~50cm**].
#     여기서는 33.1/2(85cm) + 12"(30cm) = 45.1/2
#   - 피트시켜 입체를 살리는 옷이 아니라 **여유있게 떨어지는 옷**이므로 무다트 원형을 쓴다.
#     둘레가 늘어난 만큼 **기장도 같이 늘려야** 실루엣이 자연스럽다
#   - **칼라 원단 결**: 겉장(우아에리)은 제결, 속장(지에리)은 **바이어스결**.
#     속감이 바이어스면 겉감이 제결로 모양을 바르게 잡고 속감에 유동성이 생긴다
#   - **암홀과 가슴선 사이 공간**이 남을수록 분량이 처지고, 부족하면 몸판이 딸려 올라간다
#   - **뒤중심을 등길이에서 3/8(1/4~1/2) 들이는 이유**: 수직으로 제도하면 뒤중심이 딸려 올라가듯
#     비리가 생긴다. 3/8 들여 직각이 되게 다시 그으면 뒤중심 길이가 늘어난다.
#     원단 밀도가 낮아 축 쳐지고 늘어날수록 들이는 양을 줄이거나 없앨 수 있다
#   - **뒤중심 턱의 총 너비는 1~1.1/2**. 이보다 커지면 뒤판이 투박해 보인다.
#     턱을 전개할 땐 **밑단은 고정하고 위만 벌린다**
extends: box_body.yaml
name: 오버사이즈 블라우스 몸판
id: oversize_blouse_body
source: reference/portfolio.pdf p.51

measurements:
  여유:         {value: 12, note: 오버분량 30cm — 패턴 가슴 45.1/2}
  진동깊이:     {value: 11}
  등길이:       {value: 15}
  엉덩이길이:   {value: 7.1/2}
  기장:         {value: 30, note: 둘레가 커진 만큼 기장도 늘린다}
  뒤어깨끝너비: {value: 9.13/16, note: 어깨너비 19.5/8 의 절반 — 어깨가 팔 쪽으로 많이 내려온다}
  앞품:         {value: 19, note: 오버사이즈 — 암홀이 깊고 넓다}
  뒤품:         {value: 20}
  옆선허리들임: {value: 0, note: 상자형. 패턴 허리 45.3/8 ≈ 가슴}
  엉덩이여유:   {value: 0}
  뒤중심들임:   {value: 3/8, note: 등길이에서 뒤중심을 들이는 양 (1/4~1/2)}
  뒤중심턱:     {value: 1.1/4, note: 총 1~1.1/2. 밑단은 고정하고 위만 벌려 전개한다}
  안단폭:       {value: 3.1/2, note: 앞중심 안단(미까시)}
  뒤중심가슴들임: {formula: "뒤중심들임"}
  뒤중심허리들임: {formula: "뒤중심들임"}

points:
  MK_TOP: {ko: 안단 위, at: ["안단폭", "FNP.y"]}
  MK_BOT: {ko: 안단 아래, at: ["안단폭", "HEM_CF.y"]}
  CBT_L:  {ko: 뒤중심턱 안쪽, at: ["CB_HEM.x - 뒤중심턱", "BNP.y"]}
  CBT_B:  {ko: 뒤중심턱 밑단쪽 끝, at: ["CB_HEM.x", "HEM_CB0.y"], note: 밑단은 고정 — 턱은 위에서만 벌어진다}

lines:
  replace:
    - {name: 뒤중심선, piece: 뒤판, role: outline, curve: [BNP, CB_BL, CB_WL],
       tangents: {BNP: [0, 1], CB_BL: [0, 1], CB_WL: [0, 1]}, handles: [[0.4, 0.4], [0.4, 0.4]]}
  add:
    - {name: 안단, piece: 앞판, role: mark, pts: [MK_TOP, MK_BOT], note: 미까시}
    - {name: 뒤중심턱, piece: 뒤판, role: fold, pts: [CBT_L, CBT_B], note: 총 1.1/4 — 위만 벌려 전개}
