# 셔츠 칼라 (반쪽, 뒤중심 골) — p.48 '칼라 및 칼라밴드'.
# 밑변은 칼라밴드 윗선에 달린다 (길이 = 칼라밴드 윗선, 앞끝은 밴드 앞중심선에서 1/16~1/8 들어감 — p.49 포개짐 방지).
# 앞끝: 아래 모서리에서 앞으로 3/4, 위로 2.1/4 → 앞변 길이 약 2.3/8 (도면 표기와 일치).
# 좌표계: 뒤중심 아래(밴드와 만나는 점)가 원점, +x 앞쪽, y 아래. 칼라는 위(−y)로.
name: 셔츠 칼라
id: shirt_collar
category: part
units: inch
source: reference/portfolio.pdf p.48

measurements:
  밑변:     {ko: 칼라 밑변 길이, value: 8.5, note: 칼라밴드 윗선 길이 — 스타일에서 자동}
  앞들임:   {value: 1/8, note: 밴드 앞끝보다 들어감 (1/16~1/8)}
  뒤높이:   {value: 3, note: 뒤중심에서 칼라 높이 (넘김 2 + 밴드 덮는 분). 도면 판단}
  앞돌출:   {value: 3/4, note: 칼라끝이 아래 모서리보다 앞으로 나가는 양}
  앞높이:   {value: 2.1/4, note: 칼라끝이 아래 모서리보다 올라가는 양}
  늘림표시: {value: 2, note: 밑변 늘림 구간 길이 (목옆점 부근)}
  앞올림:   {value: 0.3, note: 밑변 앞끝이 뒤중심보다 올라가는 양 (도면 판단) — 밑변이 처지지 않게}

points:
  CB_BOT:  {ko: 뒤중심 아래, at: [0, 0]}
  CB_TOP:  {ko: 뒤중심 위,   at: [0, "-뒤높이"]}
  FR_BOT:  {ko: 앞 아래 모서리, at: ["밑변 - 앞들임", "-앞올림"]}
  TIP:     {ko: 칼라끝,      from: FR_BOT, dx: 앞돌출, dy: "-앞높이"}
  ST1:     {ko: 늘림 시작,   at: ["밑변 * 0.45", 0]}
  ST1T:    {from: ST1, dy: -0.25}
  ST2:     {ko: 늘림 끝,     at: ["밑변 * 0.45 + 늘림표시", 0]}
  ST2T:    {from: ST2, dy: -0.25}

lines:
  - {name: 뒤중심, role: fold, pts: [CB_BOT, CB_TOP]}
  - {name: 밑변, role: outline, curve: [CB_BOT, FR_BOT],
     tangents: {CB_BOT: [1, 0], FR_BOT: [1, -0.12]}, handles: [[0.5, 0.3]], note: 칼라밴드 윗선에 달림}
  - {name: 앞변, role: outline, pts: [FR_BOT, TIP]}
  - {name: 윗선, role: outline, curve: [TIP, CB_TOP],
     tangents: {TIP: [-1, -0.05], CB_TOP: [-1, 0]}, handles: [[0.4, 0.4]]}
  - {name: 늘림표시1, role: notch, pts: [ST1, ST1T]}
  - {name: 늘림표시2, role: notch, pts: [ST2, ST2T]}
