# 와이드 팬츠 — p.37–38.
#
# 유의사항 (p.37):
#   - 와이드는 **뒤중심을 눕혀 A자가 되기보다 세워서** 제도하는 것을 선호한다. 세우는 방법 두 가지:
#     ① **허벅지선에서 절개해 M.P** — 엉덩이둘레는 유지되지만 밑위길이가 짧아진다
#     ② **다트를 추가** — 엉덩이둘레와 밑위길이는 유지되지만 디자인이 변형된다
#   - 바지부리는 **기본 10~11"**. 앞뒤 밑단 차이는 보통 1/2 이지만 와이드에서 1/2 을 쓰면
#     비율이 맞지 않아 **옆솔기선이 뒤판 쪽으로 치우쳐 보인다.** 바지통이 커질수록 **1 까지** 준다
#     (밑단둘레 12 → 앞 11, 뒤 13)
#
# 유의사항 (p.38) — 뒤중심 경사·위치:
#   - **경사**: 세우면(①) 쳐지는 분량 없이 미적으로 좋지만 뒤중심 길이가 짧아 불편하고,
#     눕히면(③) 편하지만 엉덩이 밑에 쳐지는 분량이 생긴다. 정장 ①, 캐주얼 ③
#   - **위치**: 경사가 같아도 어디를 뒤중심으로 잡느냐가 실루엣을 바꾼다.
#     엉덩이선에서 바지주름선 기준 ③(2")처럼 가까이 잡으면 옆솔기~무릎이 바이어스로 심하게 기울어
#     피트되는 디자인에 맞지만, 주름을 잡는 디자인에서는 주름이 중심 쪽으로 몰린다.
#     ①(먼 위치)은 와이드, ②는 스트레이트에 적절하다
