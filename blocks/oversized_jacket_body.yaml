# 오버사이즈 자켓 몸판 — p.99–100. 통사이바 절개.
#
# 유의사항 (p.100):
#   - **통사이바 디자인의 앞판 사이바 위치는 옆솔기선에서 1.1/2 내외**로, 앞을 적게 나가고
#     뒤를 많이 나간다. 뒤(2.3/4)보다 앞(1.5/8) 가슴둘레가 작은 이유는
#     **오버사이즈에서 옆솔기선이 뒤로 넘어가 보일 수 있기 때문**이다
#   - **오버사이즈에서 두 장 소매의 겹침분을 안 주기도 한다.** 겹침분을 주면 소매 뒤가 볼록해지는데
#     이미 소매와 몸판이 크기 때문에 티가 많이 나지 않는다
#   - **앞품과 뒤품 차이는 기본 1/2~5/8** 이지만 **앞넥이 V자로 많이 파여 앞이 벌어질 수 있으면
#     뒤품이 5/8 보다 더 크게** 차이나게 제도할 수 있다.
#     품 차이보다 **앞암홀과 뒤암홀이 자연스럽게 연결되는 것**이 더 중요하다
#   - **여성복이라도 제어깨에서 1 이상 커지면 남성패드**를 쓰며, **패드가 들어가는 디자인은
#     어깨를 드롭시키지 않는다.** 남성패드 10mm 라면 그대로 1cm 를 올리는 것이 아니라
#     **0.6cm(1/4) 정도만** 어깨각도를 올린다
extends: jacket_body.yaml
name: 오버사이즈 자켓 몸판
id: oversized_jacket_body
source: reference/portfolio.pdf p.99

measurements:
  여유:         {value: 9.5/8, note: 패턴 가슴 43.1/8}
  진동깊이:     {value: 10.7/8}
  기장:         {value: 30.3/8}
  뒤어깨끝너비: {value: 9.11/16, note: 어깨너비 19.3/8}
  앞뒤품차:     {value: 2, note: p.99 표기 앞품/2 8 · 뒤품/2 9. 앞넥이 많이 파여 뒤품을 크게 벌린다}
  앞품:         {value: 16, note: p.99 표기 앞품/2 = 8}
  가슴다트폭:   {value: 0, note: 오버사이즈 — 무다트}
  허리다트폭:   {value: 0}
  옆선허리들임: {value: 15/32, note: 패턴 허리 41.1/4}
  엉덩이여유:   {value: 7/32, note: 패턴 엉덩이 44}
  밑단벌림:     {value: 1/16, note: 패턴 밑단 44.1/4}
  힙포인트올림: {value: 0}
  패드두께:     {value: 3/8, note: 제어깨에서 1 이상 커져 남성패드. 패드 10mm 에 1/4 만 올린다}
  패드올림비:   {value: 0.6, note: 남성패드는 어깨끝에 달려 두께 그대로가 아니라 0.6 만 올린다}
  어깨드롭:     {value: 0, note: 패드가 들어가는 디자인은 드롭시키지 않는다}
  통사이바앞:   {value: 1.5/8, note: 옆솔기선에서 앞쪽으로}
  통사이바뒤:   {value: 2.3/4, note: 옆솔기선에서 뒤쪽으로 — 앞보다 많이 나간다}

points:
  TS_F_T: {ko: 통사이바 앞 위, at: ["앞반폭 - 통사이바앞", "UP2.y"]}
  TS_F_H: {ko: 통사이바 앞 밑단, at: ["앞밑단반 - 통사이바앞", "HEM_CF.y"]}
  TS_B_T: {ko: 통사이바 뒤 위, at: ["전폭 - 뒤반폭 + 통사이바뒤", "UP2.y"]}
  TS_B_H: {ko: 통사이바 뒤 밑단, at: ["전폭 - 뒤밑단반 + 통사이바뒤", "HEM_CB0.y"]}

lines:
  remove: [앞사이바, 뒤사이바]
  add:
    - {name: 통사이바앞선, piece: 앞판, role: mark, curve: [TS_F_T, TS_F_H],
       tangents: {TS_F_T: [0, 1], TS_F_H: [0, 1]}, handles: [[0.4, 0.4]]}
    - {name: 통사이바뒤선, piece: 뒤판, role: mark, curve: [TS_B_T, TS_B_H],
       tangents: {TS_B_T: [0, 1], TS_B_H: [0, 1]}, handles: [[0.4, 0.4]]}
