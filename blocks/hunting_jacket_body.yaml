# 헌팅 자켓 몸판 — p.91–94. 오버사이즈, 무다트.
#
# 유의사항 (p.92):
#   - **오버사이즈 어깨각도**: **뒤어깨각도만 1/4 올리면** 앞뒤 각 1/8 씩 올린 것과 같으면서
#     옷이 커졌을 때 **어깨선이 뒤로 넘어가 보이는 것을 방지**할 수 있다
#   - 오버사이즈에서 **어깨너비가 원형보다 1 이상 커지면 어깨끝이 눌리는 것을 방지하려고 어깨선을
#     드롭**시킨다. 드롭의 적당한 수치는 **3/8~1/2** 이고, **대부분 뒤보다 앞을 더 내려**
#     어깨끝점이 뒤로 넘어가 보이지 않게 한다
#
# 유의사항 (p.93):
#   - **뒤중심을 사선으로 제도하는 이유**: 등이 꺼진 입체형태를 따라가며 뒤길이 달리는 현상을 보완한다.
#     **밀도가 낮고 쳐지는 원단일수록 적게, 밀도가 높고 탄탄한 원단일수록 크게** 들인다.
#     뒷목점에서 밑단까지 사선으로 그릴 때 늘어지는 원단은 **1/4~3/8**, 광목·데님 자켓은 **3/4**.
#     **1/2 보다 더 들어가면 뒤중심이 일직선으로 내려오면서 어깨가 눌린다(사가리)**
#   - **무다트 원형의 암홀 분량 처리**: 요크선을 기준으로 암홀을 **1/2 줄이고 정점은 BP** 로 잡는다.
#     암홀을 절개해 1/2 을 M.P 시키고 앞중심선을 BP 와 수평 위치에서 늘리는 방법(쓰리찌까이)도 있으나
#     앞중심선이 휘어 지퍼 달기가 어렵고 볼록 튀어나온다.
#     **앞길이가 부족하면 암홀을 기준으로 1/4 늘린다.** 암홀이 1/4 남지만 오버사이즈라 티가 나지 않는다
extends: jacket_body.yaml
name: 헌팅 자켓 몸판
id: hunting_jacket_body
source: reference/portfolio.pdf p.91

measurements:
  여유:         {value: 12.7/8, note: 패턴 가슴 46.3/8}
  진동깊이:     {value: 10}
  기장:         {value: 26, note: p.91 눈금 표기}
  어깨드롭:     {value: 7/16, note: 3/8~1/2. 어깨너비가 원형보다 1 이상 커질 때}
  앞어깨드롭:   {formula: "어깨드롭", note: 뒤보다 앞을 더 내린다}
  뒤어깨드롭:   {formula: "어깨드롭 - 뒤어깨각도올림"}
  뒤어깨각도올림: {value: 1/4, note: 뒤만 1/4 올리면 앞뒤 각 1/8 올린 것과 같으면서 어깨선이 뒤로 안 넘어간다}
  뒤어깨끝내림: {formula: "뒤어깨끝내림기준 + 뒤어깨드롭"}
  뒤어깨끝너비: {value: 9.13/16, note: 어깨너비 19.5/8}
  앞품:         {value: 16.1/2, note: 오버사이즈 — 암홀을 넓게}
  가슴다트폭:   {value: 0, note: 무다트 — 오버사이즈}
  허리다트폭:   {value: 0}
  옆선허리들임: {value: -1/16, note: 패턴 허리 46.5/8}
  엉덩이여유:   {value: 5/16, note: 패턴 엉덩이 47.5/8}
  밑단벌림:     {value: 0}
  힙포인트올림: {value: 0}
  뒤중심사선:   {value: 5/8, note: "쳐지는 원단 1/4~3/8, 광목·데님 3/4. 1/2 넘으면 어깨가 눌린다(사가리)"}
  뒤중심가슴들임: {formula: "뒤중심사선 * 0.55"}
  뒤중심허리들임: {formula: "뒤중심사선"}
  무다트암홀줄임: {value: 1/2, note: 요크선을 기준으로 암홀을 줄인다. 정점은 BP}
  요크깊이:     {value: 4, note: 뒷목점에서 요크 절개선까지}
  낸단폭:       {value: 1.1/4}

points:
  EXT_T: {ko: 낸단 위끝(칼라끝), at: ["-낸단폭", "FNP.y"]}
  YK_CB: {ko: 요크 뒤중심, at: ["CB_BL.x", "BNP.y + 요크깊이"]}
  YK_AH: {ko: 요크 암홀쪽, at: ["전폭 - 뒤품/2", "BNP.y + 요크깊이 + 1/2"]}

lines:
  # 헌팅 자켓은 테일러드 라펠이 없다 — 지퍼 여밈에 오픈 칼라가 달린다 (p.91 도면)
  remove: [앞허리다트, 뒤허리다트, 라펠꺾임선, 고지라인, 라펠노치, 라펠외곽]
  replace:
    - {name: 낸단, piece: 앞판, role: outline, pts: [EXT_T, EXT_B], note: 지퍼가 물리는 앞단}
  add:
    - {name: 앞목선, piece: 앞판, role: outline, curve: [SNP_F, G_NF, FNP],
       tangents: {SNP_F: {perp: [SNP_F, SP_F]}, FNP: [-1, 0]}, handles: [[0.2, 0.55], [0.29, 0.2]]}
    - {name: 낸단위선, piece: 앞판, role: outline, pts: [FNP, EXT_T]}
    - {name: 뒤요크선, piece: 뒤판, role: mark, curve: [YK_CB, YK_AH],
       tangents: {YK_CB: [1, 0], YK_AH: [1, 0.4]}, handles: [[0.4, 0.4]],
       note: 무다트 암홀 분량을 이 절개로 M.P 한다}
