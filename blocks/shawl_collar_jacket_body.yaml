# 숄 칼라 자켓 몸판 — p.85–88.
#
# 유의사항 (p.86–87) — 무다트 원형으로 제도할 때 생기는 세 가지 현상과 해결:
#   ① **앞길이가 달려 올라간다** → 무다트는 기본적으로 앞길이가 달려 올라가므로 **1/4 가량 벌린다.**
#      암홀을 절개해 라펠을 벌리는데, 이는 앞네크 너비가 넓어지는 것과 같은 결과다
#   ② **뒷길이가 달려 올라간다** → 허리선을 절개해 뒤중심 길이를 늘린다. 단, 먼저 **견갑골 입체분량 1/4 을
#      뒤중심까지 절개해 뒤암홀을 줄이고 뒤중심을 벌리는 것**을 기본으로 한 다음, 부족한 만큼 늘린다.
#      암홀에서 평행하게 절개해 1/4 늘리고 뒤중심선·암홀선을 다시 블렌딩한다 (찝고·벌리고·옮기고·내리고)
#   ③ **암홀이 흐른다** → **쓰리찌까이**: 암홀에서 꺾음선으로 절개해 흐르는 분량만큼 M.P 하면
#      자연스럽게 앞네크너비가 넓어진다. 줄어든 가슴둘레와 암홀라인을 맞추면
#      결과적으로 암홀은 줄고 앞네크너비는 넓어지며 앞길과 가슴둘레는 변형되지 않는다
#   - **웰트 포켓(하꼬)**: 목옆점에서 **8" 내려오고 앞중심에서 2" 나간** 지점에 하꼬 끝이 가는 것이
#     일반적이고, 하꼬 **밑선은 직선이 아니라 끝을 1/2~7/8(기본 5/8) 올려** 제도해야 쳐져 보이지 않는다
