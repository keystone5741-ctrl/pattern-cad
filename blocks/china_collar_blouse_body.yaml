# 차이나 칼라 블라우스 몸판 — p.53–54.
#
# 유의사항 (p.54):
#   - **상의의 엉덩이둘레는 신체보다 2.1/2 이상 여유**가 좋다. 2.1/2 로 딱 맞게 하면 타이트한 실루엣이 된다.
#     셔츠에서 힙라인 옆선을 **1/4 이하로만 늘리면 A자가 아니라 일자 또는 오마진** 형태가 된다.
#     A자 실루엣을 만들려면 **힙을 3/4 가량 더** 늘린다 → 35.1/2 + 2.1/2 + 3/4 = 38.3/4
#   - **셔링·턱 소매는 몸판 어깨를 3/8~3/4 줄인다** (여기 5/8). 줄이지 않으면 턱 분량 때문에
#     소매가 옆으로 퍼져 어깨가 더 넓게 나온다
#   - **네크 조정**: 앞네크너비를 1/8 깎으면 앞중심네크를 3/16 내린다 (2:3),
#     뒤네크너비를 1/8 깎으면 뒤중심네크를 1/16 내린다 (2:1) → top_body 의 앞·뒤네크깎음
#   - **후라쉬(플랩)** 제도: ① 후라쉬 분량만큼 시접을 주고 봉제 시접을 하나 더 넣어 절개로 만든다
#     (꿀렁이면 M.P 로 없앨 수 있다) ② 후라쉬 분량의 두 배를 나가 골로 접어 절개 없이 만든다
#     (골로 만든 후라쉬는 꿀렁임을 M.P 로 없앨 수 없다)
#
# 미확인: 도면 p.53 몸판 어깨 아래(가슴선 위)에 '턱' 표기가 앞 2개·뒤 2개 있는데
#         어디서 시작해 어디로 가는 턱인지 도면만으로 확정하지 못했다 → docs/drafting_notes.md
