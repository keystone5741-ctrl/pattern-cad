  add:
    - {name: 앞허리선, piece: 앞판, role: outline, curve: [HB_CF, HB_CF1, FLF_허리],
       tangents: {HB_CF: [1, 0], HB_CF1: [1, 0]}, handles: [[0.33, 0.33], [0.45, 0.45]]}
    - {name: 앞옆선, piece: 앞판, role: outline, curve: [FLF_허리, FLF_엉덩이, FLF_밑단끝],
       tangents: {FLF_허리: {along: [FLF_허리, FLF_엉덩이]}, FLF_엉덩이: {along: [FLF_허리, FLF_밑단끝]}, FLF_밑단끝: {along: [FLF_엉덩이, FLF_밑단끝]}},
       handles: [[0.34, 0.34], [0.34, 0.34]]}
    - {name: 앞밑단, piece: 앞판, role: outline, curve: [CF_HEM, FLF_밑단끝],
       tangents: {CF_HEM: [1, 0]}, handles: [[0.45, 0.45]]}
    - {name: 뒤허리선, piece: 뒤판, role: outline, curve: [HB_CB, HB_CB1, FLB_허리],
       tangents: {HB_CB: [-1, 0], HB_CB1: [-1, 0]}, handles: [[0.33, 0.33], [0.45, 0.45]]}
    - {name: 뒤옆선, piece: 뒤판, role: outline, curve: [FLB_허리, FLB_엉덩이, FLB_밑단끝],
