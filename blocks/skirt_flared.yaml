# 플레어 스커트 — p.15–16. A라인 스커트 원형을 이용한다.
#
# A라인보다 벌림량을 크게 준 것. **밑단 총 벌림이 8" 를 넘으면 A라인이 아니라 플레어**다 (p.10).
# 벌림을 한 곳에 몰지 않고 **절개선 4 개**로 나눠 부채꼴로 전개한다 (도면 p.15 에 방사형 절개선이 여러 개).
#
# 유의사항 (p.15–16):
#   **뒤 플레어를 앞보다 20~30% 더 준다** — 뒤 엉덩이둘레가 넓어 같은 양이면 앞보다 적어 보인다.
#   원단이 뻣뻣하면 플레어 양이 많아질수록 자연스럽게 떨어지지 않고 뻗어나가다 각지게 떨어진다.
#   플레어 양이 과하면 곡이 울렁거린다 (남는 분량이 겹쳐서) → 전개량을 줄인다.
#   원하는 위치에 플레어를 넣으려면 그 자리 허리선을 각지게 재단하고 오비에 맞춰 봉제한다.
#   스트레치 원단은 몸판 허리선을 1/8~1/4 작게 제도하고 늘림 표시. 허리가 안 맞으면 옆솔기는 그대로 두고 몸판에서 M.P.
#   중심선이 식서면 옆솔기선이 바이어스결이 되어 완성 후 늘어난다 — 감안한다.
extends: skirt_hipbone.yaml
name: 플레어 스커트
id: skirt_flared
source: reference/portfolio.pdf p.15

measurements:
  앞옆선들임: {value: 5/8}
  플레어량: {value: 2.1/2, note: "절개선 하나가 밑단에서 벌어지는 양. 4곳 × 2 = 총 20\" 로 8\" 를 크게 넘어 플레어. 사이즈표의 패턴 엉덩이 57.1/2 는 부채꼴로 펼친 평면 치수라 여기 계산(약 47)과 다르다 — 확인 필요"}
  뒤가산:   {value: 0.25, note: 뒤 플레어를 앞보다 20~30% 더}
  앞벌림:   {formula: "플레어량"}
  뒤벌림:   {formula: "플레어량 * (1 + 뒤가산)"}
  옆벌림:   {formula: "플레어량"}
  절개길이: {formula: "기장 - (힙본내림 - 옆선올림)"}
  앞벌림각: {formula: "atan2(앞벌림, 절개길이)"}
  뒤벌림각: {formula: "atan2(뒤벌림, 절개길이)"}
  앞절개0위치: {formula: "(앞폭 * 0.2000)"}
  앞절개1위치: {formula: "(앞폭 * 0.4000)"}
  앞절개2위치: {formula: "(앞폭 * 0.6000)"}
  앞절개3위치: {formula: "(앞폭 * 0.8000)"}
  뒤절개0위치: {formula: "앞폭 + 뒤폭 - (뒤폭 * 0.2000)"}
  뒤절개1위치: {formula: "앞폭 + 뒤폭 - (뒤폭 * 0.4000)"}
  뒤절개2위치: {formula: "앞폭 + 뒤폭 - (뒤폭 * 0.6000)"}
  뒤절개3위치: {formula: "앞폭 + 뒤폭 - (뒤폭 * 0.8000)"}

