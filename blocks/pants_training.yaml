# 트레이닝 팬츠 — p.35–36. 고무줄(E-밴드) 허리, 다트 없이 허리를 셔링으로 처리한다.
#
# 유의사항 (p.35):
#   - 고무줄 밴드에 **스티치가 여러 줄 들어갈수록 허리둘레가 늘어난다.** 따라서 완성하고자 하는
#     허리둘레(예: "E-Band 완성사이즈 27\"")를 작업지시서에 반드시 적는다.
#     원단·스티치 줄 수에 따라 E-밴드 길이를 줄이거나 늘린다
#   - **신축성이 적은 원단**은 고무줄을 달기 전 허리 패턴 사이즈가 신체 엉덩이둘레보다 작으면
#     입을 수 없다 — 반드시 확인한다
#   - 엉덩이둘레를 줄이고 싶지 않을 때는 **뒤중심 각도를 눕히거나 다트를 넣어** 허리선을 줄인다
#   - **레지끼선(주름선) 위치**: 기본 팬츠는 앞중심에서 3.1/2~3.5/8 이지만,
#     허벅지둘레가 넓은 바지는 **샅과 엉덩이의 중심쯤**에 오도록 제도하기도 한다
#     (원형의 앞주름선 = (앞폭 − 앞샅)/2 가 바로 이 위치다)
#
# 유의사항 (p.36) — 옆솔기선이 골로 되어있는 트레이닝 팬츠:
#   앞판과 뒤판의 옆선을 붙여 블렌딩하면 옆선 절개 없이 골로 된 팬츠를 만들 수 있다. 두 가지 방법:
#   1) **밑단과 허리를 붙인다** — 엉덩이둘레가 작아진다. 트레이닝은 엉덩이가 여유로워 문제되지 않는다
#   2) **밑단과 엉덩이를 붙인다** — 허리둘레가 커져 셔링이 많아진다.
#      셔링을 줄이려면 다트를 넣거나 앞·뒤중심을 곡으로 들어간다
#   → 옆선골 은 아래 `옆선골` 치수로 표시만 해 둔다 (조각화 단계에서 실제로 붙인다)
extends: pants_basic.yaml
name: 트레이닝 팬츠
id: pants_training
source: reference/portfolio.pdf p.35

measurements:
  엉덩이여유: {value: 3, note: 패턴 엉덩이 38.1/2}
  앞뒤차:     {value: 5/8, note: 앞폭 9, 뒤폭 10.1/4}
  앞중심들임: {value: 0, note: 고무줄 허리 — 앞중심을 들이지 않는다}
  밑위길이:   {value: 10.1/2}
  기장:       {value: 37, note: 총장 37 — 고무줄 밴드는 허리선 위로 따로 붙는다}
  앞샅:       {value: 1.1/4}
  뒤샅:       {value: 4.1/8}
  뒤샅내림:   {value: 5/8}
  뒤중심각:   {value: 7.1/2, note: 캐주얼 — 많이 눕힌다. 엉덩이를 줄이지 않고 허리를 줄이려면 더 눕힌다}
  뒤중심올림: {value: 0}
  옆선올림:   {value: 0, note: 고무줄 허리라 옆선을 올리지 않는다}
  앞허리반:   {value: 8.7/8, note: 앞 W/4 + 여유. 다트 없이 셔링}
  뒤허리반:   {value: 10, note: 뒤 W/4 + 여유}
  패턴허리:   {formula: "(앞허리반 + 뒤허리반) * 2", note: 37.3/4 — 이것이 고무줄 달기 전 허리}
  밴드완성:   {value: 27, note: E-밴드 완성 허리. 작업지시서에 반드시 기입}
  밴드폭:     {value: 1.3/4}
  앞무릎폭:   {value: 9.1/4}
  뒤무릎폭:   {value: 10.1/4}
  밑단둘레:   {value: 9}
  앞뒤밑단차: {value: 1/2}
  밑단접음:   {value: 1/2, note: 삼봉스티치}
  옆선골:     {choice: 절개, options: [절개, 골], note: 골이면 앞·뒤 옆선을 붙여 한 장으로 (p.36)}
  앞다트폭:   {value: 0}
  뒤다트폭:   {value: 0}

points:
  F_W_SS:  {ko: 앞 옆선 허리점, at: ["앞중심들임 + 앞허리반", "-옆선올림"]}
  B_W_SS:  {ko: 뒤 옆선 허리점, at: ["B_W_CB.x + 뒤허리반", "-옆선올림"]}
  F_HEM_UP: {ko: 앞 밑단 접음선 인심쪽, from: F_HEM_IN, dy: "-밑단접음"}
  F_HEM_UP2: {ko: 앞 밑단 접음선 옆솔기쪽, from: F_HEM_OUT, dy: "-밑단접음"}
  B_HEM_UP: {from: B_HEM_IN, dy: "-밑단접음"}
  B_HEM_UP2: {from: B_HEM_OUT, dy: "-밑단접음"}

lines:
  remove: [앞허리선안, 앞다트, 앞허리선밖, 뒤허리선안, 뒤다트, 뒤허리선밖]
  add:
    - {name: 앞허리선, piece: 앞판, role: outline, pts: [F_W_CF, F_W_SS], note: 다트 없음 — 고무줄 셔링}
    - {name: 뒤허리선, piece: 뒤판, role: outline, pts: [B_W_CB, B_W_SS]}
    - {name: 앞밑단접음, piece: 앞판, role: fold, pts: [F_HEM_UP, F_HEM_UP2], note: 삼봉스티치 1/2}
    - {name: 뒤밑단접음, piece: 뒤판, role: fold, pts: [B_HEM_UP, B_HEM_UP2]}
